<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Rush — PFLX Lite</title>
<!-- ═══════════════════════════════════════════════════════════════════
     VAULT RUSH v0.1 (EXO spec v1.1 Phase 4b) — Blooket Gold-Quest-style
     class game. Question sets power the game: answer right → crack one
     of three vaults → GOLD (65%), STEAL from the leader (20%), or BUST
     (15%, lose 25% of your net). Full-luck per Ennis's ruling; gold is
     VIRTUAL — real XC only moves when the host awards the podium at the
     end (proposals over PflxDataBus, plus lite_activity audit rows).

     Rooms without websockets: polling over Supabase app_data.
     · Room row  pflx_lite_room_<CODE>   — written ONLY by the host
       { state: lobby|play|end, set:{name,cards}, endsAt, hostId }
     · Player row pflx_lite_rp_<CODE>_<pid> — written ONLY by that player
       { name, gold, events:[{type:'steal',from,amt}|{type:'bust',amt}], ts }
     Effective score = own gold − steals recorded against you in OTHER
     players' rows (computed identically by every client) — no row is
     ever written by two parties, so no clobbering (May sync lesson).
     ═══════════════════════════════════════════════════════════════════ -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:radial-gradient(ellipse at 50% -20%, #2b1a06 0%, #0d0803 65%); color:#fff3e0;
         font-family:'Rajdhani',sans-serif; user-select:none; overflow-x:hidden; }
  #app { max-width:880px; margin:0 auto; padding:16px; min-height:100%; display:flex; flex-direction:column; }
  .hd { font-family:'Orbitron'; font-weight:900; letter-spacing:0.14em; color:#ffd166; font-size:16px; text-align:center; padding:8px 0 14px; text-shadow:0 0 18px rgba(255,209,102,0.5); }
  .card { background:rgba(255,224,178,0.05); border:1px solid rgba(255,209,102,0.22); border-radius:16px; padding:16px; margin-bottom:14px; }
  .cardT { font-family:'Orbitron'; font-size:10px; font-weight:800; letter-spacing:0.14em; color:#c9a36a; margin-bottom:10px; text-transform:uppercase; }
  .btn { cursor:pointer; border-radius:12px; padding:12px 20px; font-family:'Orbitron'; font-size:11px; font-weight:800; letter-spacing:0.08em;
         border:1px solid rgba(255,209,102,0.5); background:rgba(255,209,102,0.12); color:#ffd166; transition:all .13s; }
  .btn:hover { background:rgba(255,209,102,0.24); }
  .btn.ghost { border-color:rgba(255,255,255,0.15); background:rgba(255,255,255,0.04); color:#c9b8a0; }
  .btn.red { border-color:rgba(255,94,94,0.5); background:rgba(255,94,94,0.1); color:#ff9c9c; }
  input, select { background:rgba(255,255,255,0.06); border:1px solid rgba(255,209,102,0.35); border-radius:10px; color:#fff;
          padding:10px 12px; font-family:'Rajdhani'; font-size:15px; width:100%; }
  .code { font-family:'Orbitron'; font-weight:900; font-size:clamp(44px,12vw,84px); letter-spacing:0.35em; color:#ffd166;
          text-align:center; text-shadow:0 0 30px rgba(255,209,102,0.6); }
  .lbrow { display:flex; align-items:center; gap:12px; padding:9px 13px; border-radius:12px; background:rgba(255,255,255,0.04); margin-bottom:6px; }
  .lbrow .pos { font-family:'Orbitron'; font-weight:900; width:32px; text-align:center; color:#c9a36a; }
  .lbrow .nm { font-family:'Orbitron'; font-size:11px; font-weight:800; color:#fff; flex:1; }
  .lbrow .val { font-family:'Orbitron'; font-size:14px; font-weight:900; color:#ffd166; font-variant-numeric:tabular-nums; }
  .lbrow.me { border:1px solid rgba(255,209,102,0.5); }
  .qterm { font-family:'Orbitron'; font-size:clamp(15px,4vw,20px); font-weight:800; text-align:center; margin:8px 0 14px; color:#fff; }
  .qgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .qa { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.13); border-radius:12px; padding:14px 12px;
        font-size:15px; font-weight:600; cursor:pointer; color:#ffe9c8; line-height:1.3; transition:all .12s; }
  .qa:hover { border-color:rgba(255,209,102,0.6); transform:translateY(-2px); }
  .qa.ok { border-color:#7dffb8; background:rgba(72,230,150,0.14); }
  .qa.no { border-color:#ff7d7d; background:rgba(255,94,94,0.12); }
  .vaults { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:10px; }
  .vault { cursor:pointer; text-align:center; padding:22px 10px; border-radius:16px; border:2px solid rgba(255,209,102,0.4);
           background:linear-gradient(180deg,rgba(255,209,102,0.1),rgba(255,209,102,0.03)); font-size:44px; transition:all .15s; }
  .vault:hover { transform:translateY(-4px) scale(1.04); box-shadow:0 8px 30px rgba(255,209,102,0.25); }
  .gold { font-family:'Orbitron'; font-weight:900; font-size:26px; color:#ffd166; text-align:center; font-variant-numeric:tabular-nums; }
  .result { text-align:center; padding:20px; font-family:'Orbitron'; font-weight:900; font-size:20px; animation:rIn .5s ease; }
  @keyframes rIn { from { opacity:0; transform:scale(.7);} to { opacity:1; transform:scale(1);} }
  .timer { font-family:'Orbitron'; font-weight:900; font-size:18px; color:#ffd166; text-align:center; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:rgba(30,20,6,0.97); border:1px solid rgba(255,209,102,0.5);
           border-radius:12px; padding:10px 18px; font-family:'Orbitron'; font-size:10px; color:#ffd166; z-index:200; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toastBox"></div>
<script>
const SUPABASE_URL = 'https://hyxiagexyptzvetqjmnj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5eGlhZ2V4eXB0enZldHFqbW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwODM4MTYsImV4cCI6MjA4OTY1OTgxNn0.hqHVlRu775dZfJrKxSFMNEPhANu5EFm7gJpaJ3RnbnY';
const H = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function kvLoad(k) { try { const r = await fetch(SUPABASE_URL + '/rest/v1/app_data?key=eq.' + k + '&select=data', { headers: H }); if (!r.ok) return null; const j = await r.json(); return j.length ? j[0].data : null; } catch (e) { return null; } }
async function kvSave(k, v) { try { const r = await fetch(SUPABASE_URL + '/rest/v1/app_data', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' }, H), body: JSON.stringify({ key: k, data: v }) }); return r.ok; } catch (e) { return false; } }
async function kvList(prefix) { try { const r = await fetch(SUPABASE_URL + '/rest/v1/app_data?key=like.' + prefix + '*&select=key,data', { headers: H }); if (!r.ok) return []; return await r.json(); } catch (e) { return []; } }
function toast(t) { const b = document.getElementById('toastBox'); b.innerHTML = '<div class="toast">' + t + '</div>'; setTimeout(() => b.innerHTML = '', 2400); }

const Q = new URLSearchParams(location.search);
const IS_HOST = Q.get('host') === '1';
const CODE = (Q.get('room') || '').toUpperCase();
const PID = Q.get('pid') || Q.get('id') || ('p-' + Math.random().toString(36).slice(2, 8));
const PNAME = Q.get('pname') || Q.get('brand') || 'Player';
const inPlatform = (window.parent !== window);
const G = { room: null, code: CODE, set: null, qs: [], qi: 0, gold: 0, events: [], answered: false, phase: 'boot', players: [], polls: {}, awarded: false };

// ── shared scoring (identical on every client) ──
function effectiveScores(rows) {
  const base = {}, steals = {};
  rows.forEach(r => {
    const d = r.data || {};
    base[d.pid] = { pid: d.pid, name: d.name || '?', gold: d.gold || 0 };
    (d.events || []).forEach(ev => { if (ev.type === 'steal' && ev.from) steals[ev.from] = (steals[ev.from] || 0) + (ev.amt || 0); });
  });
  return Object.keys(base).map(pid => ({ pid: pid, name: base[pid].name, score: Math.max(0, base[pid].gold - (steals[pid] || 0)) }))
    .sort((a, b) => b.score - a.score);
}
async function pollPlayers() { const rows = await kvList('pflx_lite_rp_' + G.code + '_'); G.players = effectiveScores(rows); }
async function pollRoom() { G.room = await kvLoad('pflx_lite_room_' + G.code); }
function myRow() { return { pid: PID, name: PNAME, gold: G.gold, events: G.events, ts: Date.now() }; }
function pushMe() { kvSave('pflx_lite_rp_' + G.code + '_' + PID, myRow()); }

// ═══════════ HOST ═══════════
async function hostSetup() {
  const sets = (await kvLoad('pflx_lite_qsets')) || { sets: [] };
  const app = document.getElementById('app');
  if (!sets.sets.length) {
    app.innerHTML = '<div class="hd">💰 VAULT RUSH</div><div class="card" style="text-align:center">No question sets yet — create one in PFLX Lite → PLAY → Manage Sets, then come back.<div style="margin-top:14px"><button class="btn ghost" onclick="history.back()">← BACK</button></div></div>';
    return;
  }
  app.innerHTML = '<div class="hd">💰 VAULT RUSH — HOST</div><div class="card">' +
    '<div class="cardT">Pick a question set</div><select id="setSel">' + sets.sets.map((s, i) => '<option value="' + i + '">' + esc(s.name) + ' (' + s.cards.length + ' questions)</option>').join('') + '</select>' +
    '<div class="cardT" style="margin-top:14px">Game length</div><select id="durSel"><option value="3">3 minutes</option><option value="5" selected>5 minutes</option><option value="8">8 minutes</option></select>' +
    '<div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="hostCreate()">CREATE ROOM</button><button class="btn ghost" onclick="history.back()">← BACK</button></div></div>';
  window._sets = sets;
}
async function hostCreate() {
  const set = window._sets.sets[parseInt(document.getElementById('setSel').value) || 0];
  const mins = parseInt(document.getElementById('durSel').value) || 5;
  G.code = Array.from({ length: 4 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random() * 23)]).join('');
  G.set = set; G.durMins = mins;
  await kvSave('pflx_lite_room_' + G.code, { state: 'lobby', set: { name: set.name, cards: set.cards }, hostId: PID, createdAt: Date.now() });
  hostLobby();
}
function hostLobby() {
  G.phase = 'lobby';
  clearInterval(G.polls.main);
  G.polls.main = setInterval(async () => { await pollPlayers(); if (G.phase === 'lobby') drawHostLobby(); }, 2500);
  drawHostLobby();
}
function drawHostLobby() {
  document.getElementById('app').innerHTML = '<div class="hd">💰 VAULT RUSH — ' + esc(G.set.name) + '</div>' +
    '<div class="card" style="text-align:center"><div class="cardT">Join at PFLX Lite → PLAY → Join with code</div><div class="code">' + G.code + '</div></div>' +
    '<div class="card"><div class="cardT">In the room (' + G.players.length + ')</div>' +
    (G.players.map(p => '<span style="display:inline-block;margin:4px;padding:7px 13px;border-radius:10px;background:rgba(255,209,102,0.1);border:1px solid rgba(255,209,102,0.3);font-family:Orbitron;font-size:10px">' + esc(p.name) + '</span>').join('') || '<div style="color:#c9a36a;font-size:13px">Waiting for players…</div>') + '</div>' +
    '<div style="display:flex;gap:8px"><button class="btn" onclick="hostStart()">▶ START (' + G.durMins + ' MIN)</button><button class="btn red" onclick="hostEnd()">END</button></div>';
}
async function hostStart() {
  const endsAt = Date.now() + G.durMins * 60000;
  await kvSave('pflx_lite_room_' + G.code, { state: 'play', set: { name: G.set.name, cards: G.set.cards }, hostId: PID, endsAt: endsAt, createdAt: Date.now() });
  G.phase = 'play'; G.endsAt = endsAt;
  clearInterval(G.polls.main);
  G.polls.main = setInterval(async () => {
    await pollPlayers();
    if (Date.now() > G.endsAt) return hostEnd();
    drawHostPlay();
  }, 2500);
  drawHostPlay();
}
function drawHostPlay() {
  const left = Math.max(0, Math.round((G.endsAt - Date.now()) / 1000));
  document.getElementById('app').innerHTML = '<div class="hd">💰 VAULT RUSH — LIVE</div>' +
    '<div class="card" style="text-align:center"><div class="timer">⏱ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + ' · ROOM ' + G.code + '</div></div>' +
    '<div class="card"><div class="cardT">Leaderboard</div>' +
    G.players.slice(0, 12).map((p, i) => '<div class="lbrow"><div class="pos">' + (i === 0 ? '👑' : i + 1) + '</div><div class="nm">' + esc(p.name) + '</div><div class="val">' + p.score.toLocaleString() + ' 🪙</div></div>').join('') + '</div>' +
    '<button class="btn red" onclick="hostEnd()">■ END GAME</button>';
}
async function hostEnd() {
  clearInterval(G.polls.main);
  await pollPlayers();
  await kvSave('pflx_lite_room_' + G.code, { state: 'end', hostId: PID, final: G.players.slice(0, 10), endedAt: Date.now() });
  G.phase = 'end';
  const podium = G.players.slice(0, 3);
  document.getElementById('app').innerHTML = '<div class="hd">🏁 FINAL RESULTS</div>' +
    '<div class="card">' + G.players.slice(0, 10).map((p, i) => '<div class="lbrow"><div class="pos">' + (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1) + '</div><div class="nm">' + esc(p.name) + '</div><div class="val">' + p.score.toLocaleString() + ' 🪙</div></div>').join('') + '</div>' +
    (podium.length ? '<button class="btn" id="awardBtn" onclick="hostAward()">🏆 AWARD XC TO TOP ' + podium.length + ' (150 / 100 / 50)</button> ' : '') +
    '<button class="btn ghost" onclick="history.back()">← BACK TO LITE</button>';
}
async function hostAward() {
  if (G.awarded) return; G.awarded = true;
  const amounts = [150, 100, 50];
  G.players.slice(0, 3).forEach((p, i) => {
    try { if (inPlatform) window.parent.postMessage(JSON.stringify({ type: 'pflx_award_proposed', playerId: p.pid, source: 'lite', award: { xc: amounts[i], reason: 'lite.vaultrush.podium' + (i + 1) } }), '*'); } catch (e) {}
    fetch(SUPABASE_URL + '/rest/v1/lite_activity', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, H),
      body: JSON.stringify({ cohort: '', player_id: p.pid, host_id: PID, kind: 'award', label: 'Vault Rush podium #' + (i + 1), xc: amounts[i] }) }).catch(() => {});
  });
  document.getElementById('awardBtn').textContent = '✓ AWARDED' + (inPlatform ? '' : ' (demo — open in Platform for real XC)');
}

// ═══════════ PLAYER ═══════════
async function playerBoot() {
  await pollRoom();
  if (!G.room) { document.getElementById('app').innerHTML = '<div class="hd">💰 VAULT RUSH</div><div class="card" style="text-align:center">Room <b style="font-family:Orbitron">' + esc(G.code) + '</b> not found. Check the code on the projector!<div style="margin-top:12px"><button class="btn ghost" onclick="history.back()">← BACK</button></div></div>'; return; }
  G.set = G.room.set; buildQs(); pushMe();
  G.phase = G.room.state;
  clearInterval(G.polls.room);
  G.polls.room = setInterval(async () => {
    await pollRoom(); if (!G.room) return;
    if (G.room.state !== G.phase) { G.phase = G.room.state; if (G.phase === 'play') { G.endsAt = G.room.endsAt; drawQ(); } if (G.phase === 'end') playerEnd(); }
    if (G.phase === 'play' && G.room.endsAt && Date.now() > G.room.endsAt) { G.phase = 'end'; playerEnd(); }
    if (G.phase === 'lobby') drawWait();
  }, 2000);
  G.polls.board = setInterval(pollPlayers, 3000);
  if (G.phase === 'play') { G.endsAt = G.room.endsAt; drawQ(); } else if (G.phase === 'end') playerEnd(); else drawWait();
}
function buildQs() {
  const cards = (G.set.cards || []).slice();
  G.qs = [];
  while (G.qs.length < 200 && cards.length >= 4) cards.slice().sort(() => Math.random() - 0.5).forEach(c => G.qs.push(c));
}
function drawWait() {
  document.getElementById('app').innerHTML = '<div class="hd">💰 VAULT RUSH</div>' +
    '<div class="card" style="text-align:center"><div style="font-size:44px">🏦</div><div style="font-family:Orbitron;font-size:13px;letter-spacing:0.1em;margin-top:8px">YOU\'RE IN, ' + esc(PNAME).toUpperCase() + '!</div>' +
    '<div style="color:#c9a36a;font-size:13px;margin-top:6px">Waiting for your teacher to start… Room ' + esc(G.code) + '</div></div>';
}
function hud() {
  const left = G.endsAt ? Math.max(0, Math.round((G.endsAt - Date.now()) / 1000)) : 0;
  const me = G.players.find(p => p.pid === PID);
  const rank = G.players.findIndex(p => p.pid === PID) + 1;
  return '<div class="card" style="display:flex;align-items:center;gap:14px;justify-content:space-between"><div class="gold">🪙 ' + ((me && me.score) != null ? me.score.toLocaleString() : G.gold.toLocaleString()) + '</div>' +
    '<div class="timer">⏱ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + '</div>' +
    '<div style="font-family:Orbitron;font-size:11px;color:#c9a36a">' + (rank ? '#' + rank + ' / ' + G.players.length : '') + '</div></div>';
}
function drawQ() {
  if (G.phase !== 'play') return;
  G.answered = false;
  const c = G.qs[G.qi % G.qs.length];
  const wrongs = G.qs.filter(x => x.definition !== c.definition).map(x => x.definition);
  const opts = [c.definition].concat(wrongs.sort(() => Math.random() - 0.5).slice(0, 3)).sort(() => Math.random() - 0.5);
  document.getElementById('app').innerHTML = '<div class="hd">💰 VAULT RUSH</div>' + hud() +
    '<div class="card"><div class="qterm">' + esc(c.term) + '</div><div class="qgrid">' +
    opts.map(o => '<div class="qa" data-v="' + esc(o) + '">' + esc(o) + '</div>').join('') + '</div></div>';
  Array.prototype.forEach.call(document.querySelectorAll('.qa'), el => {
    el.onclick = () => {
      if (G.answered || G.phase !== 'play') return; G.answered = true;
      const ok = el.getAttribute('data-v') === c.definition;
      el.classList.add(ok ? 'ok' : 'no');
      G.qi++;
      setTimeout(() => { ok ? drawVaults() : drawQ(); }, ok ? 350 : 800);
    };
  });
}
function drawVaults() {
  if (G.phase !== 'play') return;
  document.getElementById('app').innerHTML = '<div class="hd">💰 VAULT RUSH</div>' + hud() +
    '<div class="card" style="text-align:center"><div class="cardT">Correct! Crack a vault…</div>' +
    '<div class="vaults"><div class="vault" onclick="crack()">🔐</div><div class="vault" onclick="crack()">🔐</div><div class="vault" onclick="crack()">🔐</div></div></div>';
}
function crack() {
  if (G.phase !== 'play') return;
  const r = Math.random() * 100;
  let html = '';
  if (r < 65) {
    const amounts = [25, 25, 50, 50, 75, 100];
    const amt = amounts[Math.floor(Math.random() * amounts.length)];
    G.gold += amt;
    html = '<div class="result" style="color:#7dffb8">💰 +' + amt + ' GOLD!</div>';
  } else if (r < 85) {
    const leader = G.players.find(p => p.pid !== PID);
    if (leader && leader.score > 0) {
      const amt = Math.min(200, Math.max(10, Math.round(leader.score * 0.15)));
      G.gold += amt; G.events.push({ type: 'steal', from: leader.pid, amt: amt, ts: Date.now() });
      html = '<div class="result" style="color:#39c0ff">😈 STOLE ' + amt + ' FROM ' + esc(leader.name).toUpperCase() + '!</div>';
    } else { G.gold += 50; html = '<div class="result" style="color:#7dffb8">💰 +50 GOLD!</div>'; }
  } else {
    const lost = Math.round(G.gold * 0.25);
    G.events.push({ type: 'bust', amt: lost, ts: Date.now() });
    G.gold = Math.max(0, G.gold - lost);
    html = '<div class="result" style="color:#ff9c9c">💥 BUST! −' + lost + ' GOLD</div>';
  }
  pushMe();
  document.getElementById('app').innerHTML = '<div class="hd">💰 VAULT RUSH</div>' + hud() +
    '<div class="card">' + html + '</div>';
  setTimeout(drawQ, 1100);
}
function playerEnd() {
  clearInterval(G.polls.room); clearInterval(G.polls.board);
  pushMe();
  pollPlayers().then(() => {
    const rank = G.players.findIndex(p => p.pid === PID) + 1;
    const me = G.players.find(p => p.pid === PID);
    document.getElementById('app').innerHTML = '<div class="hd">🏁 GAME OVER</div>' +
      '<div class="card" style="text-align:center"><div style="font-size:48px">' + (rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '🏦') + '</div>' +
      '<div style="font-family:Orbitron;font-weight:900;font-size:20px;margin-top:8px">' + (rank ? '#' + rank : '—') + ' · ' + ((me && me.score) || 0).toLocaleString() + ' 🪙</div>' +
      '<div style="color:#c9a36a;font-size:13px;margin-top:8px">Watch the projector — podium may earn real XC!</div></div>' +
      '<div class="card">' + G.players.slice(0, 10).map((p, i) => '<div class="lbrow ' + (p.pid === PID ? 'me' : '') + '"><div class="pos">' + (i + 1) + '</div><div class="nm">' + esc(p.name) + '</div><div class="val">' + p.score.toLocaleString() + '</div></div>').join('') + '</div>' +
      '<button class="btn ghost" onclick="history.back()">← BACK TO LITE</button>';
  });
}
