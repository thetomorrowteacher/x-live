<title>X-Live — Classroom</title>
<!-- ═══════════════════════════════════════════════════════════════════
     X-LIVE v0.17, Sept 6 2026 — PATCH X-LIVE v0.17: consumes the
     xliveOnly=true flag the Platform's new /xlive restricted login
     door (PATCH PLATFORM v1.138) carries on its SSO handoff URL.
     adoptFromParams() now sets L.xliveOnly, and rPlay() hides the
     Battle Arena "OPEN IN PLATFORM" dead-end card when it's set --
     a player who logged in through /xlive only ever sees the
     bundled Vault Rush mini-game, per Ennis's confirmed Battle
     Arena scope answer. Closes out the X-Live Mode Login feature
     (PATCH PLATFORM v1.136-v1.139 + this). See
     pflx-pathway-portal/docs/HANDOFF.md for the full writeup.
     ═══════════════════════════════════════════════════════════════════
-->
<!-- ═══════════════════════════════════════════════════════════════════
     X-LIVE v0.16, Sept 6 2026 — PATCH X-LIVE v0.16 (Phase 3b of the
     Native Live Sessions plan, additive/no-risk -- ships independently
     of the Phase 3a Mission Control cutover): new Post a Link + QR
     broadcast tool on the Tools tab. Reuses Mission Control's own
     pflx_broadcasts app_data key with the same read-merge-write
     discipline as pflxPostBroadcast (fetch current items, append, cap
     at 100, write back) so a link posted here shows up the same way a
     plain-text broadcast from Mission Control does, and vice versa --
     one shared feed. Every X-Live instance (host + player) polls the
     key every 20s and shows a full-screen dismissible overlay with a
     real clickable link and a QR code (qrcode-generator CDN, same
     library + multi-CDN fallback chain the Console already uses) on
     any new item. See pflx-pathway-portal/docs/HANDOFF.md for the full
     writeup.
     X-LIVE v0.15, Sept 5 2026 — PATCH X-LIVE v0.15 (Phase 2 of the Native
     Live Sessions plan): GO LIVE, host run controls, the player-side
     live experience, and real reward wiring. Host GO LIVE (from a
     scheduled session) seeds currentSlideIndex/hostControls and opens a
     run panel (rLiveRun) with NEXT/PREV/REVEAL, PAUSE, LOCK RESPONSES,
     and FREEZE; PICK links to the existing Randomizer (wheelOpen(), as-
     is) and MAKE GROUPS links to the Teams tab, per the plan's own "no
     new code needed" call. Players see a JOIN banner
     (nativeLiveSessionBanner) on their own screens for any active
     session matching their cohort scope; a native live screen
     (rLiveNative) renders the current slide per type and submits
     responses through v0.13's merge-safe saveSession(). Rewards are now
     wired for real (fixing v0.13/v0.14's stated no-op): attendance XC/
     badge on JOIN, completion XC/badge on END, and per-slide correct-
     answer XC/badge on REVEAL — every grant is deduped through the
     session's shared awardedTo[] list so a stale re-poll or a repeated
     host action can never double-grant. Sessions now poll every 5s
     while actually live/relevant to this client (scheduleSessionsPoll),
     falling back to v0.13's 60s cadence otherwise. See
     pflx-pathway-portal/docs/HANDOFF.md for the full writeup.
     X-LIVE v0.14, Sept 5 2026 — PATCH X-LIVE v0.14 (Phase 1b of the Native
     Live Sessions plan): native host session-building UI. New 🔴 LIVE host
     tab (rLive/rLiveList/rLiveBuilder); a slide builder for 10 v1 slide
     types (text, media, poll, multiple choice, quiz, open response,
     discussion, timer, challenge, push task) via renderSlideModal(),
     each with type-conditional options/correct-answer marking/timer/
     per-slide reward XC + a real badge picker (badgeSelectHtml, reusing
     v0.12's L.badges); session-level cohort scoping (reuses cohortList())
     and attendance/completion rewards. All writes go through v0.13's
     merge-safe saveSession(); DELETE soft-deletes (status:'archived')
     rather than splicing, so mergeSession()'s terminal-status guard
     protects it as a tombstone. Authoring only — no GO LIVE/run controls/
     player-side rendering yet, that's Phase 2. See
     pflx-pathway-portal/docs/HANDOFF.md for the full writeup.
     X-LIVE v0.13, Sept 5 2026 — PATCH X-LIVE v0.13 (Phase 1a of the Native
     Live Sessions plan): merge-safe session data layer. New L.sessions
     state + loadSessions()/saveSession(sess), reusing the SAME Supabase
     app_data key ('sessions') Mission Control's mcSessions already writes,
     but read-merge-write instead of a wholesale-array sync — mergeSession()
     unions liveParticipants by player id, unions each slide's responses by
     player id (two students answering at once never clobber each other),
     never lets a stale poll resurrect a session another client already
     ended (terminal status always wins), and never shrinks the awardedTo
     dedupe list. No UI yet — this phase is the data layer only; Phase 1b
     adds the native host session-building UI, Phase 2 adds GO LIVE/run
     controls/player experience/real reward wiring, Phase 3 retires Mission
     Control's old Live Session systems and ships the link+QR broadcast
     tool. See pflx-pathway-portal/docs/HANDOFF.md for the full writeup.
     v0.12, Sept 5 2026 — real Primary/Premium Digital Badges + relevant
     Upgrades/Taxes/Fines from X-Coin (loadCoinCategories/loadModifiers,
     grantBadge/applyModifier, badgeModal/modifierModal); v0.11 removed the
     duplicate Group Maker card from Tools (TEAMS tab already covers it)
     and dropped the ClassDojo mention from the Noise Meter description;
     X-LIVE v0.10 (renamed from PFLX Live, Sept 5 2026 — PATCH X-LIVE
     v0.10: full external rebrand. GitHub repo + Pages URL renamed
     pflx-lite -> x-live (https://thetomorrowteacher.github.io/x-live);
     every user-facing string, comment, and <title> in this file now
     says X-Live/X-LIVE; the brand lockup swapped to the new Ennis-
     provided X Live Horizontal/Square.png artwork, and the old
     PFLX_LIVE_LOGO_(HORIZONTAL/STACKED) consts renamed to
     XLIVE_LOGO_(HORIZONTAL/STACKED). Internal app key/URL slug/cloud
     keys still stay 'lite' intentionally (pflx_lite_* Supabase keys,
     data-app="lite" contract with the Console, lite_activity table)
     to avoid a data migration — only the repo name, its URL, and
     every user-facing string changed;
     v0.9, Sept 5 2026 — Players roster grid (rClass) is now sorted
     (default: XC high->low) with a host-facing sort dropdown (XC
     high->low/low->high, Name A->Z/Z->A) via sortedRoster()/
     setRosterSort(); v0.8 removed the team-name pill from that same
     grid, and the projector-screen watermark (projTeams/projOpen)
     moved from bottom-left to top-left and enlarged 20px -> 34px
     tall; v0.7 real PFLX X LIVE brand lockup (Ennis-provided) swapped
     in for the header, loading splash, and floating watermark,
     replacing PFLX_LOGO_MARK + plain text in those 3 spots
     (PFLX_LOGO_MARK itself is untouched/still defined, now fully
     unused/legacy); v0.6 (Sept 5) added real player profile photos +
     an Avatar style setting to exoAvatarHTML; v0.5, Sept 3 2026 —
     futuristic HUD redesign: #hudbg animated background layer,
     card/tab/button HUD styling, PFLX_LOGO_MARK branding; v0.4 wired
     roster to live Console data.
     ONE standalone classroom app — fast live-class energy, RPG-style game
     layer, powered by the PFLX economy that already exists. Now also
     reflects the Console's own Live Sessions (join code / roster /
     status) when a host starts one — see the LIVE banner + L.liveSession.
     · Identity: PFLX Platform (sso URL params / postMessage), same
       contract as Battle Arena. Standalone = Demo Mode.
     · XC awards/fines/upgrades ride PflxDataBus (pflx_award_proposed
       to the Platform parent — Console stays the ONLY balance
       authority). Every action also writes a lite_activity audit row,
       which powers the weekly / most-improved boards.
     · Roster: X-Coin seed (read-only) + player_avatars EXO renders.
     · Cloud keys owned by X-Live (still lite_*-prefixed internally):
       pflx_lite_config, pflx_lite_qsets,
       pflx_lite_room_* (Vault Rush rooms). Table: lite_activity.
     ═══════════════════════════════════════════════════════════════════ -->
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:radial-gradient(ellipse at 50% -20%, #101b3f 0%, #060a18 65%);
         color:#eaf0ff; font-family:'Exo 2',sans-serif; user-select:none; overflow-x:hidden; position:relative; }
  button { font-family:inherit; }
  #app { position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:14px 16px 40px; }

  /* ═══ HUD background layer — fixed, decorative, behind every screen ═══
     One #hudbg div lives once in <body> (outside #app) so it stays put
     across every render() screen swap and the read-only Live Agenda path.
     Kept low-opacity + pointer-events:none so it never fights legibility
     or intercepts taps. */
  #hudbg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .hud-grid { position:absolute; inset:-10%; opacity:0.06;
    background-image:
      linear-gradient(rgba(57,192,255,0.9) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,192,255,0.9) 1px, transparent 1px);
    background-size:42px 42px; animation:hudGridDrift 70s linear infinite; }
  @keyframes hudGridDrift { from{ transform:translate(0,0); } to{ transform:translate(42px,42px); } }
  .hud-glow { position:absolute; border-radius:50%; filter:blur(70px); opacity:0.28; animation:hudPulse 10s ease-in-out infinite; }
  .hud-glow.g1 { width:440px; height:440px; top:-140px; left:-110px; background:#39c0ff; }
  .hud-glow.g2 { width:380px; height:380px; bottom:-150px; right:-90px; background:#a855f7; animation-delay:-3.3s; }
  .hud-glow.g3 { width:300px; height:300px; top:38%; right:8%; background:#ffd166; opacity:0.14; animation-delay:-6.6s; }
  @keyframes hudPulse { 0%,100%{ opacity:0.2; transform:scale(1); } 50%{ opacity:0.38; transform:scale(1.12); } }
  .hud-scan { position:absolute; left:0; right:0; height:160px; top:-160px;
    background:linear-gradient(180deg, transparent, rgba(57,192,255,0.10), transparent);
    animation:hudScan 8s linear infinite; }
  @keyframes hudScan { from{ transform:translateY(0); } to{ transform:translateY(160vh); } }
  .hud-ring { position:absolute; border:1px solid rgba(57,192,255,0.12); border-radius:50%; }
  .hud-ring.r1 { width:580px; height:580px; top:-230px; right:-230px; animation:hudRotate 95s linear infinite; }
  .hud-ring.r1::before { content:''; position:absolute; inset:36px; border:1px dashed rgba(255,209,102,0.10); border-radius:50%; }
  .hud-ring.r2 { width:380px; height:380px; bottom:-170px; left:-150px; border-color:rgba(168,85,247,0.14); animation:hudRotate 75s linear infinite reverse; }
  @keyframes hudRotate { from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) {
    .hud-grid, .hud-glow, .hud-scan, .hud-ring, .logo-mark svg { animation:none !important; }
  }
  .hd { display:flex; align-items:center; gap:12px; padding:6px 0 14px; flex-wrap:wrap; }
  .hd .logo { display:inline-flex; align-items:center; gap:8px; font-family:'Audiowide'; font-weight:900; font-size:18px; letter-spacing:0.12em; color:#7de9ff; text-shadow:0 0 16px rgba(0,229,255,0.4); }
  .hd .logo b { color:#ffd166; }
  .logo-mark { display:inline-flex; width:28px; height:28px; filter:drop-shadow(0 0 6px rgba(57,192,255,0.55)); }
  .logo-img { height:30px; width:auto; display:block; filter:drop-shadow(0 0 6px rgba(57,192,255,0.35)); }
  .logo-mark svg { width:100%; height:100%; animation:hudRotate 16s linear infinite; }
  .logo-pulse { display:inline-block; width:6px; height:6px; border-radius:50%; background:#7dffb8; box-shadow:0 0 8px rgba(125,255,184,0.9);
                animation:hudPulseDot 1.8s ease-in-out infinite; margin-left:2px; }
  @keyframes hudPulseDot { 0%,100%{ opacity:0.35; transform:scale(0.8); } 50%{ opacity:1; transform:scale(1.15); } }
  .hd .sub { font-size:12px; color:#8a93b8; }
  .hd .sp { flex:1; }
  .tabbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { cursor:pointer; padding:10px 16px; font-family:'Audiowide'; font-size:10.5px; font-weight:800;
         letter-spacing:0.08em; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.03); color:#9aa3c8;
         clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px); transition:all .15s; }
  .tab.on { border-color:#39c0ff; background:rgba(57,192,255,0.13); color:#7de9ff;
            box-shadow:0 0 16px rgba(57,192,255,0.3), inset 0 0 10px rgba(57,192,255,0.12); }
  .card { position:relative; background:rgba(255,255,255,0.045); border:1px solid rgba(57,192,255,0.16); border-radius:16px; padding:16px;
           box-shadow:0 0 0 1px rgba(0,0,0,0.15), 0 10px 30px rgba(0,0,0,0.25); }
  .card::before, .card::after { content:''; position:absolute; width:13px; height:13px; pointer-events:none; border-color:rgba(57,192,255,0.55); border-style:solid; border-width:0; }
  .card::before { top:-1px; left:-1px; border-top-width:2px; border-left-width:2px; border-top-left-radius:6px; }
  .card::after { bottom:-1px; right:-1px; border-bottom-width:2px; border-right-width:2px; border-bottom-right-radius:6px; }
  .cardT { font-family:'Audiowide'; font-size:10px; font-weight:800; letter-spacing:0.14em; color:#9aa3c8; margin-bottom:12px; text-transform:uppercase; }
  .bigbtn { cursor:pointer; padding:12px 18px; font-family:'Audiowide'; font-size:11px; font-weight:800; letter-spacing:0.08em;
            border:1px solid rgba(57,192,255,0.45); background:rgba(57,192,255,0.12); color:#7de9ff; transition:all .13s;
            clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
  .bigbtn:hover { background:rgba(57,192,255,0.24); }
  .bigbtn.gold { border-color:rgba(255,209,102,0.55); background:rgba(255,209,102,0.12); color:#ffd166; }
  .bigbtn.red { border-color:rgba(255,94,120,0.5); background:rgba(255,94,120,0.1); color:#ff8ba0; }
  .bigbtn.green { border-color:rgba(72,230,150,0.5); background:rgba(72,230,150,0.1); color:#7dffb8; }
  .bigbtn.ghost { border-color:rgba(255,255,255,0.14); background:rgba(255,255,255,0.03); color:#9aa3c8; }
  /* roster tiles */
  #roster { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:12px; }
  .ptile { position:relative; cursor:pointer; background:rgba(255,255,255,0.045); border:2px solid rgba(255,255,255,0.09);
           border-radius:16px; padding:12px 8px 10px; text-align:center; transition:all .14s; }
  .ptile:hover { border-color:rgba(57,192,255,0.5); transform:translateY(-2px); }
  .ptile.sel { border-color:#ffd166; background:rgba(255,209,102,0.09); box-shadow:0 0 14px rgba(255,209,102,0.25); }
  .ptile .av { width:58px; height:58px; margin:0 auto 6px; }
  .ptile .av svg { width:100%; height:100%; filter:drop-shadow(0 0 8px rgba(120,140,255,0.5)); }
  .ptile .av .ph { width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg,#26335f,#101b3f);
                   display:flex; align-items:center; justify-content:center; font-family:'Audiowide'; font-weight:800; color:#7de9ff; font-size:16px; }
  .ptile .nm { font-family:'Audiowide'; font-size:9px; font-weight:800; color:#fff; letter-spacing:0.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ptile .xc { font-size:11px; color:#ffd166; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
  .ptile .tm { position:absolute; top:6px; left:6px; font-family:'Audiowide'; font-size:7px; padding:2px 6px; border-radius:6px; color:#fff; }
  .burst { position:absolute; top:4px; right:8px; font-family:'Audiowide'; font-weight:900; font-size:14px; pointer-events:none; opacity:0; }
  .burst.show { animation:bPop 1.1s ease forwards; }
  @keyframes bPop { 0%{opacity:0; transform:translateY(6px) scale(.6);} 25%{opacity:1; transform:translateY(-6px) scale(1.2);} 100%{opacity:0; transform:translateY(-24px);} }
  /* action tray */
  #tray { position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:80; display:none; align-items:center; gap:8px;
          background:rgba(8,12,28,0.97); border:1px solid rgba(255,209,102,0.4); border-radius:16px; padding:10px 14px; max-width:96vw; overflow-x:auto;
          box-shadow:0 8px 40px rgba(0,0,0,0.6); }
  #tray.on { display:flex; }
  .traybtn { cursor:pointer; white-space:nowrap; border-radius:12px; padding:9px 13px; font-family:'Audiowide'; font-size:9.5px; font-weight:800;
             letter-spacing:0.05em; border:1px solid rgba(72,230,150,0.45); background:rgba(72,230,150,0.1); color:#7dffb8; }
  .traybtn.fine { border-color:rgba(255,94,120,0.45); background:rgba(255,94,120,0.09); color:#ff8ba0; }
  .traybtn.misc { border-color:rgba(179,136,255,0.45); background:rgba(179,136,255,0.1); color:#cbb8ff; }
  /* leaderboard */
  .lbrow { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:12px; background:rgba(255,255,255,0.03); margin-bottom:7px; }
  .lbrow .pos { font-family:'Audiowide'; font-weight:900; width:34px; text-align:center; font-size:14px; color:#8a93b8; }
  .lbrow .av { width:38px; height:38px; } .lbrow .av svg { width:100%; height:100%; }
  .lbrow .nm { font-family:'Audiowide'; font-size:10.5px; font-weight:800; color:#fff; flex:1; }
  .lbrow .val { font-family:'Audiowide'; font-size:13px; font-weight:900; color:#ffd166; font-variant-numeric:tabular-nums; }
  .lbrow.top1 { background:linear-gradient(90deg,rgba(255,209,102,0.16),rgba(255,255,255,0.03)); border:1px solid rgba(255,209,102,0.35); }
  .lbrow.top1 .pos { color:#ffd166; }
  /* modal */
  #modal { position:fixed; inset:0; z-index:120; background:rgba(3,5,14,0.8); display:none; align-items:center; justify-content:center; padding:18px; }
  #modal.on { display:flex; }
  #modalBox { background:#0c1228; border:1px solid rgba(57,192,255,0.35); border-radius:18px; padding:22px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; }
  input, select, textarea { background:rgba(255,255,255,0.06); border:1px solid rgba(57,192,255,0.3); border-radius:10px; color:#fff;
          padding:9px 11px; font-family:'Exo 2'; font-size:14px; width:100%; }
  label { font-size:11px; color:#8a93b8; letter-spacing:0.06em; display:block; margin:10px 0 4px; text-transform:uppercase; font-family:'Audiowide'; font-weight:700; }
  /* projector */
  #proj { position:fixed; inset:0; z-index:200; background:radial-gradient(ellipse at 50% -20%, #101b3f 0%, #05070f 70%); display:none;
          flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
  #proj.on { display:flex; }
  .projTitle { font-family:'Audiowide'; font-weight:900; font-size:clamp(22px,3.6vw,40px); letter-spacing:0.14em; color:#7de9ff; margin-bottom:22px; }
  /* wheel */
  #wheelWrap { position:relative; width:min(66vh,420px); height:min(66vh,420px); }
  #wheel { width:100%; height:100%; border-radius:50%; border:6px solid rgba(57,192,255,0.4); transition:transform 4.2s cubic-bezier(.12,.7,.1,1); }
  #wheelPin { position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:30px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:300; background:rgba(8,14,32,0.97);
           border:1px solid rgba(57,192,255,0.45); border-radius:12px; padding:11px 20px; font-family:'Audiowide'; font-size:10px;
           letter-spacing:0.06em; color:#7de9ff; }
  .goalwrap { height:26px; border-radius:13px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,209,102,0.3); overflow:hidden; position:relative; }
  .goalfill { height:100%; background:linear-gradient(90deg,#39c0ff,#ffd166); transition:width .8s ease; }
  .goaltxt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Audiowide'; font-size:10px; font-weight:800; color:#fff; letter-spacing:0.08em; }
  .demoBanner { background:rgba(255,209,102,0.1); border:1px solid rgba(255,209,102,0.4); color:#ffd166; border-radius:12px;
                padding:9px 14px; font-size:12px; margin-bottom:14px; text-align:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  @media (max-width:640px){ .grid2 { grid-template-columns:1fr; } }
  .feedrow { display:flex; gap:10px; align-items:center; font-size:12.5px; color:#aeb6d8; padding:6px 4px; border-bottom:1px solid rgba(255,255,255,0.05); }
  .feedrow b { color:#fff; } .feedrow .t { margin-left:auto; font-size:10px; color:#5c6488; white-space:nowrap; }
  .upcard { border:1px solid rgba(179,136,255,0.35); background:rgba(179,136,255,0.07); border-radius:14px; padding:14px; text-align:center; }
  .upcard .ic { font-size:26px; } .upcard .lb { font-family:'Audiowide'; font-size:10px; font-weight:800; color:#fff; margin:6px 0; }
</style>
</head>
<body>
<div id="hudbg">
  <div class="hud-grid"></div>
  <div class="hud-glow g1"></div>
  <div class="hud-glow g2"></div>
  <div class="hud-glow g3"></div>
  <div class="hud-ring r1"></div>
  <div class="hud-ring r2"></div>
  <div class="hud-scan"></div>
</div>
<div id="app"></div>
<div id="tray"></div>
<div id="modal"><div id="modalBox"></div></div>
<div id="proj"></div>
<div id="toastBox"></div>
<script>

}

}

function adoptFromParams() {
  try {
    const p = new URLSearchParams(location.search);
    if (p.get('sso') !== 'pflx') return false;
    L.me = { id: p.get('id') || '', brand: p.get('brand') || p.get('user') || 'Host', role: p.get('role') || 'Student' };
    L.isHost = /admin|host|teacher|instructor/i.test(L.me.role) || p.get('host') === '1';
    L.demo = false;
    // v0.17 -- carried by the Platform's /xlive restricted login door
    // (pflxXLiveBuildRedirectURL in preview.html). Restricts this session
    // to the bundled Vault Rush mini-game only, per Ennis's confirmed
    // scope answer -- the full Battle Arena app stays out of scope.
    L.xliveOnly = p.get('xliveOnly') === 'true';
    return true;
  } catch (e) { return false; }
}
// PATCH X-LIVE v0.20 -- handles the Console's 'open_session' handoff
// (PATCH PLATFORM v1.141, redirecting its own native Live Session entry
// points here). Looks up the session by CODE against the already-loaded
// L.sessions (same Supabase app_data key as the Console's mcSessions --
// no separate fetch needed) and lands the user on the right screen:
// liveManageSession for a host (resume managing a session already live
// elsewhere -- deliberately not liveGoLiveSession, which would re-run
// go-live setup and refuse a session with no slides yet), liveJoinSession
// for a player.
function pflxTryOpenPendingSession() {
  const code = L.pendingOpenSessionCode; if (!code) return;
  if (!L.loaded.sessions || !L.me) return;
  const s = L.sessions.find(function (x) { return x.code === code; });
  if (!s) return;
  L.pendingOpenSessionCode = null;
  if (L.isHost) { liveManageSession(s.id); } else { liveJoinSession(s.id); }
}
window.pflxTryOpenPendingSession = pflxTryOpenPendingSession;

window.addEventListener('message', function (e) {
  let m = e.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch (er) { return; } }
  if (!m || !m.type) return;
  if ((m.type === 'pflx_identity_broadcast' || m.type === 'pflx_identity_response') && m.user) {
    L.me = { id: m.user.id, brand: m.user.brand || m.user.brandName || m.user.name, role: m.user.role || 'Student' };
    L.isHost = /admin|host|teacher|instructor/i.test(L.me.role) || m.user.isHost === true;
    L.demo = false; resolveMyId(); render();
    pflxTryOpenPendingSession();
  }
  if (m.type === 'pflx_player_changed' && m.player) {
    const p = L.roster.find(r => r.id === m.player.id);
    if (p) { p.xc = (typeof m.player.xc === 'number') ? m.player.xc : (m.player.xcoin || p.xc); p.totalXc = m.player.totalXcoin || p.totalXc; render(); }
  }

  // X-Live ↔ Console Live Sessions (PATCH LITE v0.2, historical name) —
  // the Console's
  // mcBroadcastToApps() fans these out to every iframe with [data-app],
  // which already includes this app (data-app="lite" in preview.html) —
  // no Console-side change was needed to receive them, only to listen.
  if (m.type === 'pflx_mc_pflx_session_started' || m.type === 'pflx_mc_pflx_session_live_broadcast') {
    const d = m.data || {};
    const prevIdx = L.liveSession && L.liveSession.currentAgendaIndex;
    L.liveSession = Object.assign({}, L.liveSession, {
      sessionId: d.sessionId, code: d.code, title: d.title,
      host: d.host, cohorts: d.cohorts || [], allCohorts: !!d.allCohorts,
      agenda: d.agenda || (L.liveSession && L.liveSession.agenda) || [],
      currentAgendaIndex: d.currentAgendaIndex != null ? d.currentAgendaIndex : ((L.liveSession && L.liveSession.currentAgendaIndex) || 0)
    });
    if (L.screen === 'liveagenda' && L.liveSession.currentAgendaIndex !== prevIdx) startAgendaTimer();
    render();
  }
  if (m.type === 'pflx_mc_pflx_open_session' && m.data && m.data.code) {
    L.pendingOpenSessionCode = m.data.code;
    pflxTryOpenPendingSession();
  }
  if (m.type === 'pflx_mc_pflx_session_ended') {
    if (!L.liveSession || !m.data || L.liveSession.sessionId === m.data.sessionId) {
      L.liveSession = null;
      stopAgendaTimer();
      if (L.screen === 'liveagenda') L.screen = L.agendaScreenFrom || (L.isHost ? 'class' : 'me');
    }
    render();
  }
});

// ─── Native Live Sessions: merge-safe data layer (Patch C1) ────────────────
// Reuses the SAME Supabase app_data key ('sessions') Mission Control's
// mcSessions already writes, but read-merge-writes it instead of the
// wholesale-array sync MC uses today — per the persistence-guardrail
// discipline, a synced collection must never be blindly overwritten.
function mergeSession(local, incoming) {
  // Merges ONE session (matched by id) — never a wholesale overwrite. The
  // side with the newer updatedAt wins on plain fields (title, mode,
  // currentSlideIndex, hostControls, rewards, ...), but liveParticipants,
  // each slide's responses, the awardedTo dedupe list, and a terminal
  // (ended/archived) status are explicitly unioned/protected below so a
  // stale poll can never drop a concurrent join/response or resurrect an
  // ended session.
  if (!local) return incoming;
  if (!incoming) return local;
  const localNewer = (local.updatedAt || 0) >= (incoming.updatedAt || 0);
  const merged = localNewer ? Object.assign({}, incoming, local) : Object.assign({}, local, incoming);

  // liveParticipants — union by player id, keep the later joinedAt per id
  const partById = {};
  (incoming.liveParticipants || []).forEach(function (p) { partById[p.id] = p; });
  (local.liveParticipants || []).forEach(function (p) {
    const existing = partById[p.id];
    if (!existing || (p.joinedAt || 0) >= (existing.joinedAt || 0)) partById[p.id] = p;
  });
  merged.liveParticipants = Object.keys(partById).map(function (k) { return partById[k]; });

  // slides — index-aligned (the slide list itself is authored, not
  // concurrently reordered live); each slide's responses union by player id
  // so two students answering at once never clobber each other.
  const localSlides = local.slides || [];
  const incomingSlides = incoming.slides || [];
  const maxLen = Math.max(localSlides.length, incomingSlides.length);
  const mergedSlides = [];
  for (let i = 0; i < maxLen; i++) {
    const ls = localSlides[i], is = incomingSlides[i];
    if (!ls) { mergedSlides.push(is); continue; }
    if (!is) { mergedSlides.push(ls); continue; }
    const slideMerged = localNewer ? Object.assign({}, is, ls) : Object.assign({}, ls, is);
    slideMerged.responses = Object.assign({}, is.responses || {}, ls.responses || {});
    mergedSlides.push(slideMerged);
  }
  merged.slides = mergedSlides;

  // one-off picks — last-write-wins on their own timestamp, independent of
  // the session's overall updatedAt (a PICK can happen between saves)
  if ((incoming.lastRandomPickAt || 0) > (local.lastRandomPickAt || 0)) {
    merged.lastRandomPickId = incoming.lastRandomPickId; merged.lastRandomPickAt = incoming.lastRandomPickAt;
  } else {
    merged.lastRandomPickId = local.lastRandomPickId; merged.lastRandomPickAt = local.lastRandomPickAt;
  }
  if ((incoming.lastGroupPickAt || 0) > (local.lastGroupPickAt || 0)) {
    merged.lastGroupPick = incoming.lastGroupPick; merged.lastGroupPickAt = incoming.lastGroupPickAt;
  } else {
    merged.lastGroupPick = local.lastGroupPick; merged.lastGroupPickAt = local.lastGroupPickAt;
  }

  // awardedTo — union, never shrinks (a player must never be able to
  // re-collect an attendance/completion award because a stale poll dropped
  // their id from this list)
  const awardSet = {};
  (incoming.awardedTo || []).forEach(function (id) { awardSet[id] = true; });
  (local.awardedTo || []).forEach(function (id) { awardSet[id] = true; });
  merged.awardedTo = Object.keys(awardSet);

  // status — a terminal (ended/archived) status always wins over a
  // non-terminal one, from EITHER side, so a stale poll can never
  // resurrect a session another client already ended.
  const TERMINAL = { ended: 1, archived: 1 };
  if (TERMINAL[incoming.status] && !TERMINAL[local.status]) merged.status = incoming.status;
  else if (TERMINAL[local.status] && !TERMINAL[incoming.status]) merged.status = local.status;
  else merged.status = localNewer ? local.status : incoming.status;

  return merged;
}
function mergeSessionList(localList, incomingList) {
  // Union two session arrays by id, merging any session present in both.
  const byId = {};
  (incomingList || []).forEach(function (s) { byId[s.id] = s; });
  (localList || []).forEach(function (s) { byId[s.id] = mergeSession(s, byId[s.id]); });
  return Object.keys(byId).map(function (k) { return byId[k]; });
}

async function saveSession(sess) {
  // Read-merge-write: fetch the CURRENT cloud sessions array, merge this
  // one session's local mutation into it (never overwrite the whole array
  // with our possibly-stale local copy), then write the merged array back.
  sess.updatedAt = Date.now();
  let cloud = [];
  try {
    const c = await kvLoad('sessions');
    if (Array.isArray(c)) cloud = c;
  } catch (e) {}
  const idx = cloud.findIndex(function (s) { return s.id === sess.id; });
  const savedSess = idx === -1 ? sess : mergeSession(sess, cloud[idx]);
  if (idx === -1) cloud.push(savedSess); else cloud[idx] = savedSess;
  L.sessions = mergeSessionList(L.sessions, cloud);
  await kvSave('sessions', cloud);
  return savedSess;
}

function weekStart(offsetWeeks) {
  const d = new Date(); const day = (d.getDay() + 6) % 7; // Monday start
  d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - day - (offsetWeeks || 0) * 7);
  return d;
}
function sumActivity(pid, from, to) {
  let s = 0;
  L.activity.forEach(a => {
    if (a.player_id !== pid) return;
    const t = new Date(a.ts);
    if (t >= from && (!to || t < to) && a.xc > 0) s += a.xc;
  });
  return s;
}
function boardData(tab) {
  const R = classRoster();
  if (tab === 'season') return R.map(p => ({ p: p, v: p.totalXc || 0 })).sort((a, b) => b.v - a.v);
  if (tab === 'weekly') { const w = weekStart(0); return R.map(p => ({ p: p, v: sumActivity(p.id, w) })).sort((a, b) => b.v - a.v); }
  if (tab === 'improved') {
    const w0 = weekStart(0), w1 = weekStart(1);
    return R.map(p => ({ p: p, v: sumActivity(p.id, w0) - sumActivity(p.id, w1, w0) })).sort((a, b) => b.v - a.v);
  }
  if (tab === 'teams') {
    const t = {}; (L.cfg.teams.names || []).forEach(n => t[n] = 0);
    const w = weekStart(0);
    R.forEach(p => { const tn = L.cfg.teams.assign[p.id]; if (tn) { t[tn] = (t[tn] || 0) + sumActivity(p.id, w); } });
    return Object.keys(t).map(n => ({ team: n, v: t[n] })).sort((a, b) => b.v - a.v);
  }
  return [];
}
const TEAM_COLORS = ['#39c0ff', '#ff8ba0', '#7dffb8', '#ffd166', '#cbb8ff', '#ffb37d'];
function teamColor(name) { const i = (L.cfg.teams.names || []).indexOf(name); return TEAM_COLORS[(i + TEAM_COLORS.length) % TEAM_COLORS.length]; }

// Read-only for everyone in this patch: the host authors and advances the

// pflx_session_live_broadcast; this screen just displays wherever the class
// currently is, plus a local countdown timer that restarts whenever the
// current step changes. Advancing FROM inside X-Live is deferred --
// there's no reverse (iframe -> Console) write channel yet.
const AGENDA_TYPE_META = {
  mindful:   { icon: '\u{1F9D8}', label: 'Mindful Moment' },
  activity:  { icon: '\u{1F4CB}', label: 'Activity' },
  project:   { icon: '\u{1F6E0}\uFE0F', label: 'Project Work' },
  game:      { icon: '\u{1F3AE}', label: 'Game / Media' },
  social:    { icon: '\u{1F91D}', label: 'Social Sprint' },
  thinkpair: { icon: '\u{1F4AC}', label: 'Think \u00B7 Pair \u00B7 Share' },
  exit:      { icon: '\u{1F3AB}', label: 'Exit Ticket' },
  custom:    { icon: '\u270F\uFE0F', label: 'Custom' }
};
let agendaTimerIv = null, agendaTimerFor = null;

function joinLiveAgenda() {
  if (!L.liveSession || !L.liveSession.agenda || !L.liveSession.agenda.length) return;
  L.agendaScreenFrom = L.screen;
  L.screen = 'liveagenda';
  startAgendaTimer();
  render();
}
function leaveLiveAgenda() {
  stopAgendaTimer();
  L.screen = L.agendaScreenFrom || (L.isHost ? 'class' : 'me');
  render();
}
function startAgendaTimer() {
  stopAgendaTimer();
  const s = L.liveSession; if (!s || !s.agenda) return;
  const item = s.agenda[s.currentAgendaIndex || 0];
  agendaTimerFor = s.currentAgendaIndex || 0;
  if (!item || !item.timer || !item.timer.enabled) return;
  let remaining = (item.timer.presetMinutes || 5) * 60;
  const total = remaining;
  const draw = () => {
    const bar = document.getElementById('agendaTimerBar');
    const val = document.getElementById('agendaTimerVal');
    if (!bar || !val) return;
    const pct = Math.max(0, Math.round((remaining / total) * 100));
    bar.style.width = pct + '%';
    bar.style.background = remaining <= 10 ? '#ff5d7a' : (pct < 30 ? '#ffd166' : '#7dffb8');
    const m = Math.floor(Math.max(0, remaining) / 60), sec = Math.max(0, remaining) % 60;
    val.textContent = m + ':' + String(sec).padStart(2, '0');
  };
  draw();
  agendaTimerIv = setInterval(() => {
    remaining--;
    if (remaining < 0) { clearInterval(agendaTimerIv); agendaTimerIv = null; draw(); return; }
    draw();
  }, 1000);
}
function stopAgendaTimer() {
  if (agendaTimerIv) { clearInterval(agendaTimerIv); agendaTimerIv = null; }
  agendaTimerFor = null;
}
function rLiveAgenda() {
  const s = L.liveSession;

      (active ? 'background:rgba(255,209,102,0.12);border:1px solid rgba(255,209,102,0.4);' : 'border:1px solid transparent;opacity:0.55;') + '">' +
      '<span style="font-size:15px;">' + m.icon + '</span>' +

  return '<div style="padding:16px;min-height:100vh;box-sizing:border-box;">' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">' +
    '<span style="font-family:Audiowide;font-size:10px;font-weight:800;letter-spacing:0.14em;color:#ff5d7a;">\u{1F534} LIVE</span>' +
    '<span style="font-family:Audiowide;font-size:12px;font-weight:800;color:#7de9ff;">' + esc(s.title || 'Session') + '</span>' +
    '<span style="flex:1"></span>' +
    '<button class="bigbtn ghost" style="padding:7px 14px;font-size:9.5px;" onclick="leaveLiveAgenda()">\u2715 LEAVE</button>' +
    '</div>' +
    '<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">' +
    '<div style="width:150px;flex:0 0 auto;">' + rail + '</div>' +
    '<div class="card" style="flex:1;min-width:240px;text-align:center;padding:28px 20px;">' +
    '<div style="font-size:34px;margin-bottom:6px;">' + meta.icon + '</div>' +
    '<div style="font-family:Audiowide;font-size:9px;letter-spacing:0.16em;color:#a78bfa;margin-bottom:4px;">' + meta.label.toUpperCase() + ' \u00B7 STEP ' + (idx + 1) + ' / ' + s.agenda.length + '</div>' +
    '<h2 style="font-family:Audiowide;font-size:19px;margin:0 0 10px;color:#f0f0ff;">' + esc(item.title) + '</h2>' +
    (item.prompt ? '<div style="font-size:14px;color:#c7cdec;line-height:1.5;max-width:440px;margin:0 auto;">' + esc(item.prompt) + '</div>' : '') +
    checklist + timerBlock +

function render() {

// ── LIVE SESSIONS — GO LIVE / RUN CONTROLS / PLAYER EXPERIENCE (Phase 2 of
//    the Native Live Sessions plan) -----------------------------------
// Every write here goes through Phase 1a's merge-safe saveSession() — no
// new persistence path. Reward dedupe reuses the SAME session-level
// awardedTo[] list Phase 1b already carried (composite keys
// 'attend:'/'complete:'/'slide:<id>:' + playerId), so a stale re-poll can
// never double-grant — same discipline the pflx-persistence-guardrail
// skill requires.
function grantSessionReward(pid, xc, badgeId, reason) {
  if (xc) { postAward(pid, { xc: xc, reason: reason }); liteLog(pid, 'session-reward', reason, xc); }
  if (badgeId) {
    const b = L.badges.find(function (x) { return x.id === badgeId; });
    if (b) {
      postAward(pid, { badge: { id: b.id, name: b.name, category: b.category || 'primary', xc: b.xc || 0, image: b.image || '' }, reason: reason + ':badge' });
      liteLog(pid, 'session-badge', b.name, b.xc || 0);
    }
  }
}
async function liveGoLiveSession(id) {
  const s = L.sessions.find(function (x) { return x.id === id; }); if (!s) return;
  if (!s.slides || !s.slides.length) { toast('Add at least one slide before going live'); return; }
  s.status = 'active';
  s.currentSlideIndex = 0;
  s.hostControls = { paused: false, responsesLocked: false, slideFrozen: false };
  await saveSession(s);
  L.liveRunningSessionId = s.id;
  L.liveEditingSession = null;
  render();
  toast('🔴 Session is LIVE' + (L.demo ? ' (demo)' : ''));
}
function liveManageSession(id) { L.liveRunningSessionId = id; render(); }
function liveExitRun() { L.liveRunningSessionId = null; render(); }
function liveMoveCurrentSlide(dir) {
  const s = L.sessions.find(function (x) { return x.id === L.liveRunningSessionId; }); if (!s) return;
  const j = (s.currentSlideIndex || 0) + dir;
  if (j < 0 || j >= s.slides.length) return;
  s.currentSlideIndex = j;
  saveSession(s); render();
}
function liveToggleControl(key) {
  const s = L.sessions.find(function (x) { return x.id === L.liveRunningSessionId; }); if (!s) return;
  s.hostControls = s.hostControls || { paused: false, responsesLocked: false, slideFrozen: false };
  s.hostControls[key] = !s.hostControls[key];
  saveSession(s); render();
}
function liveRevealSlide() {
  const s = L.sessions.find(function (x) { return x.id === L.liveRunningSessionId; }); if (!s) return;
  const sl = s.slides[s.currentSlideIndex || 0]; if (!sl) return;
  const meta = slideTypeMeta(sl.type);
  sl.revealed = true;
  if (meta.graded && sl.rewardXc) {
    s.awardedTo = s.awardedTo || [];
    Object.keys(sl.responses || {}).forEach(function (pid) {
      const r = sl.responses[pid];
      if (r && r.value === sl.correctIndex) {
        const key = 'slide:' + sl.id + ':' + pid;
        if (s.awardedTo.indexOf(key) === -1) {
          s.awardedTo.push(key);
          grantSessionReward(pid, sl.rewardXc, sl.rewardBadgeId, 'xlive-session:' + s.id + ':slide:' + sl.id);
        }
      }
    });
  }
  saveSession(s); render();
}

// PATCH X-LIVE v0.19 -- Phase 1d: YouTube/OBS embed, an independent
// broadcast mode alongside the LiveKit video room (Phase 1a-1c). No
// server, no SDK -- the host runs OBS themselves and pastes the
// resulting YouTube Live URL/ID here; every player's rLiveNative()
// screen embeds it as a plain iframe. Kept as its own function (not an
// inline regex) so it's independently testable, same convention as
// pflxXLivePinMatches.
function pflxYouTubeExtractId(input) {
  if (!input) return null;
  var s = String(input).trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  var m;
  m = s.match(/[?&]v=([A-Za-z0-9_-]{11})/); if (m) return m[1];
  m = s.match(/youtu\.be\/([A-Za-z0-9_-]{11})/); if (m) return m[1];
  m = s.match(/youtube\.com\/live\/([A-Za-z0-9_-]{11})/); if (m) return m[1];
  m = s.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{11})/); if (m) return m[1];
  return null;
}
window.pflxYouTubeExtractId = pflxYouTubeExtractId;

async function liveSetYouTubeEmbedFromInput() {
  const el = document.getElementById('liveYtInput');
  const id = pflxYouTubeExtractId(el ? el.value : '');
  if (!id) { toast('Could not find a YouTube video ID in that — paste the full Live URL or just the ID.'); return; }
  const s = L.sessions.find(function (x) { return x.id === L.liveRunningSessionId; }); if (!s) return;
  s.youtubeEmbedId = id;
  await saveSession(s);
  render();
  toast('📺 YouTube stream set for this session');

function nativeSessionAppliesToMe() {

// Reuses Mission Control's own pflx_broadcasts app_data key (pflxPostBroadcast's

async function sendLinkBroadcast() {
  const urlEl = document.getElementById('bcUrl');
  const msgEl = document.getElementById('bcMsg');

  const message = (msgEl && msgEl.value || '').trim();
  if (!url) { toast('Enter a link first'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const from = (L.me && L.me.brand) || 'Host';
  const b = { id: 'bc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), message: message, url: url, from: from, at: Date.now() };
  try {
    const cur = (await kvLoad('pflx_broadcasts')) || {};
    const list = Array.isArray(cur.items) ? cur.items.slice() : [];
    list.push(b);
    while (list.length > 100) list.shift();
    await kvSave('pflx_broadcasts', { items: list });
  } catch (e) {}
  modalClose();
  toast('📡 Sent!');
  // Show it locally right away for the host too (don't wait for the next poll)
  bcSetLastSeenAt(b.at);
  showBroadcastOverlay(b);
}

// ── Receive broadcasts (host + player) ──
var PFLX_BC_SEEN_KEY = 'pflx_lite_bc_last_at';
function bcGetLastSeenAt() {
  try {
    var v = localStorage.getItem(PFLX_BC_SEEN_KEY);
    if (v) return parseInt(v, 10) || 0;
  } catch (e) {}
  // First run on this browser: baseline to "now" so old history doesn't replay
  var now = Date.now();
  try { localStorage.setItem(PFLX_BC_SEEN_KEY, String(now)); } catch (e) {}
  return now;
}
function bcSetLastSeenAt(ts) {
  try { localStorage.setItem(PFLX_BC_SEEN_KEY, String(ts)); } catch (e) {}
}
async function loadBroadcasts() {
  try {
    const data = await kvLoad('pflx_broadcasts');
    const items = (data && Array.isArray(data.items)) ? data.items : [];
    if (!items.length) return;
    const lastAt = bcGetLastSeenAt();
    const fresh = items.filter(b => b && typeof b.at === 'number' && b.at > lastAt).sort((a, b) => a.at - b.at);
    if (!fresh.length) return;
    const latest = fresh[fresh.length - 1];
    bcSetLastSeenAt(latest.at);
    showBroadcastOverlay(latest);
  } catch (e) {}
}
function showBroadcastOverlay(b) {
  const existing = document.getElementById('bcOverlay');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'bcOverlay';

  el.innerHTML =

      (b.message ? ('<div style="font-size:16px;color:#fff;margin:10px 0;line-height:1.5;">' + esc(b.message) + '</div>') : '') +
      (b.url ? ('<a href="' + esc(b.url) + '" target="_blank" rel="noopener" style="display:inline-block;color:#7dd3fc;font-size:13px;word-break:break-all;margin:8px 0;">' + esc(b.url) + '</a><div id="bcQr" style="margin:14px auto 0;width:fit-content;"></div>') : '') +
      '<button class="bigbtn gold" onclick="document.getElementById(\'bcOverlay\').remove()" style="margin-top:16px;">GOT IT</button>' +

function renderBroadcastQr(text) {
  _loadQRLib(function () {
    const host = document.getElementById('bcQr');
    if (!host) return;
    host.innerHTML = '';
    const canvas = generateBroadcastQRCanvas(text, 200);
    if (canvas) host.appendChild(canvas);
  });
}
// QR generation — CDN library (qrcode-generator) with the same multi-CDN
// fallback chain the Console uses (preview.html), so it's proven-reliable.
var _qrLibLoaded = false;
var _qrLibCallbacks = [];
var _qrCDNs = [
  'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',
  'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js',
  'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'
];
function _loadQRLib(cb) {
  if (_qrLibLoaded && window.qrcode) { cb(); return; }
  _qrLibCallbacks.push(cb);
  if (_qrLibCallbacks.length > 1) return;
  var cdnIdx = 0;
  function tryNext() {
    if (cdnIdx >= _qrCDNs.length) { console.warn('[XLIVE] All QR CDNs failed'); return; }
    var s = document.createElement('script');
    s.src = _qrCDNs[cdnIdx++];
    s.onload = function () {
      if (typeof window.qrcode === 'function') {
        _qrLibLoaded = true;
        _qrLibCallbacks.forEach(fn => { try { fn(); } catch (e) {} });
        _qrLibCallbacks = [];
      } else { tryNext(); }
    };
    s.onerror = function () { tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
}
function generateBroadcastQRCanvas(text, size) {
  try {
    if (typeof window.qrcode === 'function') {
      const qr = window.qrcode(0, 'L');
      qr.addData(text);
      qr.make();
      const modules = qr.getModuleCount();
      if (modules > 0) {
        const margin = 2;
        const totalMods = modules + margin * 2;
        const cellSize = Math.max(Math.floor(size / totalMods), 2);
        const actualSize = cellSize * totalMods;
        const canvas = document.createElement('canvas');
        canvas.width = actualSize; canvas.height = actualSize;
        canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, actualSize, actualSize);
        ctx.fillStyle = '#000000';
        for (let r = 0; r < modules; r++) {
          for (let c = 0; c < modules; c++) {
            if (qr.isDark(r, c)) ctx.fillRect((c + margin) * cellSize, (r + margin) * cellSize, cellSize, cellSize);
          }
        }
        return canvas;
      }
    }
  } catch (e) { console.error('[XLIVE] QR generation error:', e); }
  return null;
}

// ── Noise Meter (ported from the Console's mcToggleNoiseMeter — same
//    getUserMedia+AnalyserNode approach, adapted to X-Live's own UI) ──
const noiseState = { active: false, ctx: null, stream: null, raf: null };
function toggleNoiseMeter() {
  if (noiseState.active) { stopNoiseMeter(); return; }
  startNoiseMeter();
}
function startNoiseMeter() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('🎙️ Microphone access is not supported in this browser.');
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    noiseState.stream = stream;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    noiseState.ctx = ctx;
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    noiseState.active = true;
    showNoiseMeterUI();
    let smooth = 0;
    function tick() {
      if (!noiseState.active) return;
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const level = sum / data.length;
      smooth = smooth * 0.8 + level * 0.2;
      updateNoiseMeterUI(Math.max(0, Math.min(100, Math.round((smooth / 130) * 100))));
      noiseState.raf = requestAnimationFrame(tick);
    }
    tick();
    const btn = document.getElementById('noiseMeterBtn');
    if (btn) btn.textContent = 'STOP LISTENING';
  }).catch(err => {
    toast('🎙️ Could not access the microphone: ' + (err && err.message ? err.message : err));
  });
}
function stopNoiseMeter() {
  noiseState.active = false;
  if (noiseState.raf) cancelAnimationFrame(noiseState.raf);
  if (noiseState.stream) { try { noiseState.stream.getTracks().forEach(t => t.stop()); } catch (e) {} }
  if (noiseState.ctx) { try { noiseState.ctx.close(); } catch (e) {} }
  noiseState.stream = null;
  noiseState.ctx = null;
  const el = document.getElementById('noiseMeterOverlay');
  if (el) el.remove();
  const btn = document.getElementById('noiseMeterBtn');
  if (btn) btn.textContent = 'START LISTENING';
}
function showNoiseMeterUI() {
  const existing = document.getElementById('noiseMeterOverlay');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'noiseMeterOverlay';
  el.style.cssText = 'position:fixed;bottom:70px;right:16px;background:rgba(10,18,40,0.95);border:1px solid rgba(57,192,255,0.3);border-radius:14px;padding:14px 18px;z-index:9999;font-family:"Exo 2",sans-serif;width:190px;box-shadow:0 10px 40px rgba(0,0,0,0.4);';
  el.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
    '<span style="font-family:Audiowide;font-size:10px;font-weight:900;color:#39c0ff;letter-spacing:0.08em;">🔊 NOISE METER</span>' +
    '<button onclick="stopNoiseMeter()" style="background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:14px;">✕</button>' +
    '</div>' +
    '<div style="height:14px;background:rgba(255,255,255,0.06);border-radius:7px;overflow:hidden;"><div id="noiseMeterBar" style="height:100%;width:0%;background:#7dffb8;transition:width 0.15s,background 0.3s;"></div></div>' +
    '<div id="noiseMeterLabel" style="text-align:center;font-size:11px;margin-top:6px;color:rgba(255,255,255,0.5);">Listening…</div>';
  document.body.appendChild(el);
}
function updateNoiseMeterUI(level) {
  const bar = document.getElementById('noiseMeterBar');
  const label = document.getElementById('noiseMeterLabel');
  if (!bar) return;
  bar.style.width = level + '%';
  const color = level < 35 ? '#7dffb8' : (level < 65 ? '#ffd166' : '#ff5d7a');
  bar.style.background = color;
  if (label) label.textContent = level < 35 ? 'Quiet 🙂' : (level < 65 ? 'Getting loud…' : 'TOO LOUD! 🚨');
}

  const n = wheelPlayers.length; if (!n) return;

  w.style.transition = 'none'; w.style.transform = 'rotate(0deg)'; void w.offsetWidth;
  w.style.transition = 'transform 4.2s cubic-bezier(.12,.7,.1,1)';

    (ex ? '<div style="font-size:10px;color:#8a93b8;font-family:Audiowide;letter-spacing:0.1em">' + EXO_LINES[ex.line].name + ' · STAGE ' + (ex.stage || 1) + '</div>' : '<div style="font-size:11px;color:#8a93b8">Visit the EXO Bay in Battle Arena to hatch your EXO!</div>') +
    '<div style="font-family:Audiowide;font-weight:900;font-size:26px;color:#ffd166;margin-top:12px">' + (p.xc || 0).toLocaleString() + ' XC</div>' +
    '<div style="font-size:11px;color:#8a93b8">+' + week.toLocaleString() + ' this week' + (L.cfg.boards.showRanks && rank ? ' · #' + rank + ' in class' : '') + (team ? ' · TEAM ' + esc(team) : '') + '</div></div>' +
    '<div class="card"><div class="cardT">🎖️ My Badges</div><div style="font-size:34px">' + '🎖️'.repeat(Math.min(12, p.badges || 0)) + (p.badges > 12 ? ' +' + (p.badges - 12) : '') + (!p.badges ? '<span style="font-size:12px;color:#8a93b8">None yet — earn your first!</span>' : '') + '</div>' +
    '<div class="cardT" style="margin-top:16px">📜 My Recent</div>' +
    L.activity.filter(a => a.player_id === p.id).slice(0, 6).map(a => '<div class="feedrow">' + ({ award: '✅', fine: '⚠️', tax: '🏛️', upgrade: '🎁', badge: '🎖️' }[a.kind] || '•') + ' ' + esc(a.label) + (a.xc ? ' <b style="color:' + (a.xc > 0 ? '#7dffb8' : '#ff8ba0') + '">' + (a.xc > 0 ? '+' : '') + a.xc + '</b>' : '') + '</div>').join('') +
    '</div></div>';
}
function rShop() {
  const p = myRecord();
  return '<div class="card"><div class="cardT">🎁 Class Upgrades — spend your XC</div>' +
    '<div class="grid3">' + L.cfg.upgrades.map((u, i) =>
      '<div class="upcard"><div class="ic">' + u.icon + '</div><div class="lb">' + esc(u.label) + '</div>' +
      '<button class="bigbtn gold" style="width:100%" onclick="buyUpgrade(' + i + ')">' + u.cost.toLocaleString() + ' XC</button></div>').join('') + '</div>' +
    '<div style="font-size:10px;color:#5c6488;margin-top:12px">Your teacher sees every redemption in the feed and makes it happen in class. Balance: ' + (p.xc || 0).toLocaleString() + ' XC</div></div>';
}
function buyUpgrade(i) {
  const u = L.cfg.upgrades[i]; const p = myRecord();
  if ((p.xc || 0) < u.cost) { toast('Not enough XC — you have ' + (p.xc || 0).toLocaleString()); return; }
  modal('<div class="cardT">Redeem ' + esc(u.label) + '?</div><div style="font-size:13px;color:#aeb6d8">This spends <b style="color:#ffd166">' + u.cost.toLocaleString() + ' XC</b>. Your teacher gets notified in the feed.</div>' +
    '<div style="margin-top:14px;display:flex;gap:8px"><button class="bigbtn gold" onclick="confirmUpgrade(' + i + ')">REDEEM</button><button class="bigbtn ghost" onclick="modalClose()">CANCEL</button></div>');
}
function confirmUpgrade(i) {
  const u = L.cfg.upgrades[i]; const p = myRecord();
  postAward(p.id, { xc: -u.cost, reason: 'lite.upgrade.' + u.id });
  p.xc = Math.max(0, (p.xc || 0) - u.cost);
  liteLog(p.id, 'upgrade', u.label, -u.cost);
  modalClose(); render(); toast('🎁 ' + u.label + ' redeemed! Your teacher has been notified.' + (L.demo ? ' (demo)' : ''));
}

// ── BOOT ──
adoptFromParams();
render();
loadCfg(); loadRoster(); loadExo(); loadActivity(); loadCohortGroups(); loadCoinCategories(); loadModifiers(); loadSessions();
setInterval(loadActivity, 60000);
bcGetLastSeenAt(); // baseline on first-ever load so old broadcast history never replays
setInterval(loadBroadcasts, 20000); // Patch X-LIVE v0.16 -- Post a Link + QR
function scheduleSessionsPoll() {
  const hot = (L.isHost && L.liveRunningSessionId) || (!L.isHost && nativeSessionAppliesToMe());
  setTimeout(async function () { await loadSessions(); scheduleSessionsPoll(); }, hot ? 5000 : 60000);
}
scheduleSessionsPoll(); // C3: 5s while a session is actually live/relevant to this client, else the same 60s cadence as C1
</script>
</body>
</html>
