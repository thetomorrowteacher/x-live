     PFLX LIVE v0.7 (rebrand of PFLX Lite v0.1 — EXO spec v1.1 Phase 4,
     PATCH LITE v0.7, Sept 5 2026 — real PFLX X LIVE brand lockup
     (Ennis-provided) swapped in for the header, loading splash, and
     floating watermark, replacing PFLX_LOGO_MARK + plain text in those
     3 spots (PFLX_LOGO_MARK itself is untouched/still defined); v0.6
     (Sept 5) added real player profile photos + an Avatar style
     setting to exoAvatarHTML; v0.5, Sept 3 2026 — futuristic HUD
     redesign: #hudbg animated background layer, card/tab/button HUD
     styling, PFLX_LOGO_MARK branding; v0.4 wired roster to live
     Console data) — internal app key/URL slug/cloud keys
     stay 'lite' intentionally (pflx-lite repo, pflx_lite_* Supabase keys,
     data-app="lite" contract with the Console) to avoid touching every
     call site across repos for a name-only change; only user-facing text
     says PFLX Live now.
     ONE standalone classroom app — ClassDojo speed, Classcraft game
     layer, powered by the PFLX economy that already exists. Now also
     reflects the Console's own Live Sessions (join code / roster /
     status) when a host starts one — see the LIVE banner + L.liveSession.
     · Identity: PFLX Platform (sso URL params / postMessage), same
       contract as Battle Arena. Standalone = Demo Mode.
     · XC awards/fines/upgrades ride PflxDataBus (pflx_award_proposed
       to the Platform parent — Console stays the ONLY balance
       authority). Every action also writes a lite_activity audit row,
       which powers the weekly / most-improved boards.
     · Roster: X-Coin seed (read-only) + player_avatars EXO renders.
     · Cloud keys owned by Lite: pflx_lite_config, pflx_lite_qsets,
       pflx_lite_room_* (Vault Rush rooms). Table: lite_activity.
     ═══════════════════════════════════════════════════════════════════ -->

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:radial-gradient(ellipse at 50% -20%, #101b3f 0%, #060a18 65%);
         color:#eaf0ff; font-family:'Exo 2',sans-serif; user-select:none; overflow-x:hidden; position:relative; }
  button { font-family:inherit; }
  #app { position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:14px 16px 40px; }

     across every render() screen swap and the read-only Live Agenda path.
     Kept low-opacity + pointer-events:none so it never fights legibility
     or intercepts taps. */
  #hudbg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .hud-grid { position:absolute; inset:-10%; opacity:0.06;
    background-image:
      linear-gradient(rgba(57,192,255,0.9) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,192,255,0.9) 1px, transparent 1px);
    background-size:42px 42px; animation:hudGridDrift 70s linear infinite; }
  @keyframes hudGridDrift { from{ transform:translate(0,0); } to{ transform:translate(42px,42px); } }
  .hud-glow { position:absolute; border-radius:50%; filter:blur(70px); opacity:0.28; animation:hudPulse 10s ease-in-out infinite; }
  .hud-glow.g1 { width:440px; height:440px; top:-140px; left:-110px; background:#39c0ff; }
  .hud-glow.g2 { width:380px; height:380px; bottom:-150px; right:-90px; background:#a855f7; animation-delay:-3.3s; }
  .hud-glow.g3 { width:300px; height:300px; top:38%; right:8%; background:#ffd166; opacity:0.14; animation-delay:-6.6s; }
  @keyframes hudPulse { 0%,100%{ opacity:0.2; transform:scale(1); } 50%{ opacity:0.38; transform:scale(1.12); } }
  .hud-scan { position:absolute; left:0; right:0; height:160px; top:-160px;
    background:linear-gradient(180deg, transparent, rgba(57,192,255,0.10), transparent);
    animation:hudScan 8s linear infinite; }
  @keyframes hudScan { from{ transform:translateY(0); } to{ transform:translateY(160vh); } }
  .hud-ring { position:absolute; border:1px solid rgba(57,192,255,0.12); border-radius:50%; }
  .hud-ring.r1 { width:580px; height:580px; top:-230px; right:-230px; animation:hudRotate 95s linear infinite; }
  .hud-ring.r1::before { content:''; position:absolute; inset:36px; border:1px dashed rgba(255,209,102,0.10); border-radius:50%; }
  .hud-ring.r2 { width:380px; height:380px; bottom:-170px; left:-150px; border-color:rgba(168,85,247,0.14); animation:hudRotate 75s linear infinite reverse; }
  @keyframes hudRotate { from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) {
    .hud-grid, .hud-glow, .hud-scan, .hud-ring, .logo-mark svg { animation:none !important; }
  }
  .hd { display:flex; align-items:center; gap:12px; padding:6px 0 14px; flex-wrap:wrap; }
  .hd .logo { display:inline-flex; align-items:center; gap:8px; font-family:'Audiowide'; font-weight:900; font-size:18px; letter-spacing:0.12em; color:#7de9ff; text-shadow:0 0 16px rgba(0,229,255,0.4); }
  .hd .logo b { color:#ffd166; }
  .logo-mark { display:inline-flex; width:28px; height:28px; filter:drop-shadow(0 0 6px rgba(57,192,255,0.55)); }
  .logo-img { height:30px; width:auto; display:block; filter:drop-shadow(0 0 6px rgba(57,192,255,0.35)); }
  .logo-mark svg { width:100%; height:100%; animation:hudRotate 16s linear infinite; }
  .logo-pulse { display:inline-block; width:6px; height:6px; border-radius:50%; background:#7dffb8; box-shadow:0 0 8px rgba(125,255,184,0.9);
                animation:hudPulseDot 1.8s ease-in-out infinite; margin-left:2px; }
  @keyframes hudPulseDot { 0%,100%{ opacity:0.35; transform:scale(0.8); } 50%{ opacity:1; transform:scale(1.15); } }
  .hd .sub { font-size:12px; color:#8a93b8; }
  .hd .sp { flex:1; }
  .tabbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { cursor:pointer; padding:10px 16px; font-family:'Audiowide'; font-size:10.5px; font-weight:800;
         letter-spacing:0.08em; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.03); color:#9aa3c8;
         clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px); transition:all .15s; }
  .tab.on { border-color:#39c0ff; background:rgba(57,192,255,0.13); color:#7de9ff;
            box-shadow:0 0 16px rgba(57,192,255,0.3), inset 0 0 10px rgba(57,192,255,0.12); }
  .card { position:relative; background:rgba(255,255,255,0.045); border:1px solid rgba(57,192,255,0.16); border-radius:16px; padding:16px;
           box-shadow:0 0 0 1px rgba(0,0,0,0.15), 0 10px 30px rgba(0,0,0,0.25); }
  .card::before, .card::after { content:''; position:absolute; width:13px; height:13px; pointer-events:none; border-color:rgba(57,192,255,0.55); border-style:solid; border-width:0; }
  .card::before { top:-1px; left:-1px; border-top-width:2px; border-left-width:2px; border-top-left-radius:6px; }
  .card::after { bottom:-1px; right:-1px; border-bottom-width:2px; border-right-width:2px; border-bottom-right-radius:6px; }
  .cardT { font-family:'Audiowide'; font-size:10px; font-weight:800; letter-spacing:0.14em; color:#9aa3c8; margin-bottom:12px; text-transform:uppercase; }
  .bigbtn { cursor:pointer; padding:12px 18px; font-family:'Audiowide'; font-size:11px; font-weight:800; letter-spacing:0.08em;
            border:1px solid rgba(57,192,255,0.45); background:rgba(57,192,255,0.12); color:#7de9ff; transition:all .13s;
            clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
  .bigbtn:hover { background:rgba(57,192,255,0.24); }
  .bigbtn.gold { border-color:rgba(255,209,102,0.55); background:rgba(255,209,102,0.12); color:#ffd166; }
  .bigbtn.red { border-color:rgba(255,94,120,0.5); background:rgba(255,94,120,0.1); color:#ff8ba0; }
  .bigbtn.green { border-color:rgba(72,230,150,0.5); background:rgba(72,230,150,0.1); color:#7dffb8; }
  .bigbtn.ghost { border-color:rgba(255,255,255,0.14); background:rgba(255,255,255,0.03); color:#9aa3c8; }
  /* roster tiles */
  #roster { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:12px; }
  .ptile { position:relative; cursor:pointer; background:rgba(255,255,255,0.045); border:2px solid rgba(255,255,255,0.09);
           border-radius:16px; padding:12px 8px 10px; text-align:center; transition:all .14s; }
  .ptile:hover { border-color:rgba(57,192,255,0.5); transform:translateY(-2px); }
  .ptile.sel { border-color:#ffd166; background:rgba(255,209,102,0.09); box-shadow:0 0 14px rgba(255,209,102,0.25); }
  .ptile .av { width:58px; height:58px; margin:0 auto 6px; }
  .ptile .av svg { width:100%; height:100%; filter:drop-shadow(0 0 8px rgba(120,140,255,0.5)); }
  .ptile .av .ph { width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg,#26335f,#101b3f);

  .ptile .nm { font-family:'Audiowide'; font-size:9px; font-weight:800; color:#fff; letter-spacing:0.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ptile .xc { font-size:11px; color:#ffd166; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }

  #wheelPin { position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:30px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:300; background:rgba(8,14,32,0.97);

  .upcard .ic { font-size:26px; } .upcard .lb { font-family:'Audiowide'; font-size:10px; font-weight:800; color:#fff; margin:6px 0; }

async function kvLoad(key) {
  try { const r = await fetch(SUPABASE_URL + '/rest/v1/app_data?key=eq.' + key + '&select=data', { headers: SB_HEADERS });
    if (!r.ok) return null; const rows = await r.json(); return rows.length ? rows[0].data : null; } catch (e) { return null; }
}
async function kvSave(key, value) {
  try { const r = await fetch(SUPABASE_URL + '/rest/v1/app_data', { method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' }, SB_HEADERS),
    body: JSON.stringify({ key: key, data: value }) }); return r.ok; } catch (e) { return false; }
}

function adoptFromParams() {
  try {
    const p = new URLSearchParams(location.search);
    if (p.get('sso') !== 'pflx') return false;
    L.me = { id: p.get('id') || '', brand: p.get('brand') || p.get('user') || 'Host', role: p.get('role') || 'Student' };
    L.isHost = /admin|host|teacher|instructor/i.test(L.me.role) || p.get('host') === '1';
    L.demo = false;
    return true;
  } catch (e) { return false; }
}
window.addEventListener('message', function (e) {
  let m = e.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch (er) { return; } }
  if (!m || !m.type) return;
  if ((m.type === 'pflx_identity_broadcast' || m.type === 'pflx_identity_response') && m.user) {
    L.me = { id: m.user.id, brand: m.user.brand || m.user.brandName || m.user.name, role: m.user.role || 'Student' };
    L.isHost = /admin|host|teacher|instructor/i.test(L.me.role) || m.user.isHost === true;
    L.demo = false; resolveMyId(); render();
  }
  if (m.type === 'pflx_player_changed' && m.player) {
    const p = L.roster.find(r => r.id === m.player.id);
    if (p) { p.xc = (typeof m.player.xc === 'number') ? m.player.xc : (m.player.xcoin || p.xc); p.totalXc = m.player.totalXcoin || p.totalXc; render(); }
  }

  // PFLX LIVE ↔ Console Live Sessions (PATCH LITE v0.2) — the Console's
  // mcBroadcastToApps() fans these out to every iframe with [data-app],
  // which already includes this app (data-app="lite" in preview.html) —
  // no Console-side change was needed to receive them, only to listen.
  if (m.type === 'pflx_mc_pflx_session_started' || m.type === 'pflx_mc_pflx_session_live_broadcast') {
    const d = m.data || {};
    const prevIdx = L.liveSession && L.liveSession.currentAgendaIndex;
    L.liveSession = Object.assign({}, L.liveSession, {
      sessionId: d.sessionId, code: d.code, title: d.title,
      host: d.host, cohorts: d.cohorts || [], allCohorts: !!d.allCohorts,
      agenda: d.agenda || (L.liveSession && L.liveSession.agenda) || [],
      currentAgendaIndex: d.currentAgendaIndex != null ? d.currentAgendaIndex : ((L.liveSession && L.liveSession.currentAgendaIndex) || 0)
    });
    if (L.screen === 'liveagenda' && L.liveSession.currentAgendaIndex !== prevIdx) startAgendaTimer();
    render();
  }
  if (m.type === 'pflx_mc_pflx_session_ended') {
    if (!L.liveSession || !m.data || L.liveSession.sessionId === m.data.sessionId) {
      L.liveSession = null;
      stopAgendaTimer();
      if (L.screen === 'liveagenda') L.screen = L.agendaScreenFrom || (L.isHost ? 'class' : 'me');
    }
    render();
  }
});

const DEMO_ROSTER = [
  ['d1','Nova','studio-gentech',1240],['d2','Pixel','studio-innov8',860],['d3','Echo','studio-mindforge',1580],
  ['d4','Fable','studio-emagination',420],['d5','Circuit','studio-gentech',2100],['d6','Lyric','studio-mindforge',690],

function mapRosterUser(u) {
  return {
    id: u.id, name: u.name, brand: u.brandName || u.brand || u.name, cohort: u.cohort || '',
    studioId: u.studioId || '', xc: (typeof u.xcoin === 'number' ? u.xcoin : u.xc) || 0,
    totalXc: u.totalXcoin || 0,
    badges: (typeof u.digitalBadges === 'number') ? u.digitalBadges : (Array.isArray(u.badges) ? u.badges.length : 0),
    image: u.image || null
  };
}
async function loadRoster() {
  // PRIMARY: live Console roster (Supabase `pflx_mc_players`) — the same data
  // Mission Control/X-Coin/Battle Arena read, kept current by every host action.
  // Fixed here (Sept 3) because the old XCOIN_SEED_URL-only path served a
  // stale, point-in-time snapshot: any cohort created/renamed after that seed
  // was taken (e.g. "Global Digital Intern") showed 0 players by construction.
  try {
    const live = await kvLoad('pflx_mc_players');
    const items = (live && Array.isArray(live.items)) ? live.items : null;
    if (items && items.length) {
      L.roster = items.filter(u => (u.role || 'player') === 'player').map(mapRosterUser);
    }
  } catch (e) {}
  // FALLBACK: static X-Coin seed snapshot (only reached if the live read
  // above failed or returned nothing — e.g. offline demo mode).
  if (!L.roster.length) {
    try {
      const r = await fetch(XCOIN_SEED_URL); if (!r.ok) throw 0;
      const d = await r.json();
      L.roster = (d.users || []).filter(u => (u.role || 'player') === 'player').map(mapRosterUser);
    } catch (e) { L.roster = DEMO_ROSTER.slice(); L.demo = L.demo || !L.roster.length; }
  }
  if (!L.roster.length) L.roster = DEMO_ROSTER.slice();
  L.loaded.roster = true; resolveMyId(); render();
}
function resolveMyId() {
  if (!L.me || L.me.resolved) return;
  if (L.me.id && L.roster.some(r => r.id === L.me.id)) { L.me.resolved = true; return; }
  const b = (L.me.brand || '').toUpperCase();
  const m = L.roster.find(r => (r.brand || '').toUpperCase() === b || (r.name || '').toUpperCase() === b);
  if (m) { L.me.id = m.id; L.me.resolved = true; }
}
async function loadExo() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/player_avatars?select=*', { headers: SB_HEADERS });
    if (r.ok) (await r.json()).forEach(row => { L.exo[row.player_id] = row; });
  } catch (e) {}
  render();
}
L.cohortNames = [];
async function loadCohortGroups() {
  // Canonical cohort registry (Console's Cohort Manager) — the roster alone
  // only reveals cohorts that currently have players, which hid the rest.
  try {
    let groups = await kvLoad('cohortGroups');
    if (!Array.isArray(groups)) { const alt = await kvLoad('pflx_mc_cohortgroups'); groups = (alt && alt.items) || []; }
    const names = {};
    (groups || []).forEach(g => {
      (Array.isArray(g.cohorts) && g.cohorts.length ? g.cohorts : [g.name]).forEach(c => { if (c) names[String(c).trim()] = 1; });
    });
    L.cohortNames = Object.keys(names);
  } catch (e) {}
  render();
}
async function loadCfg() {
  const d = await kvLoad('pflx_lite_config');
  L.cfg = Object.assign({}, DEFAULT_CFG, d || {});
  L.cfg.teams = Object.assign({ names: [], assign: {} }, L.cfg.teams || {});
  L.cfg.boards = Object.assign({}, DEFAULT_CFG.boards, L.cfg.boards || {});
  L.loaded.cfg = true; render();
}
function saveCfg() { L.cfg.updatedAt = Date.now(); kvSave('pflx_lite_config', L.cfg); }
async function loadActivity() {
  try {
    const since = new Date(Date.now() - 15 * 86400000).toISOString();
    const r = await fetch(SUPABASE_URL + '/rest/v1/lite_activity?ts=gte.' + since + '&select=*&order=ts.desc&limit=800', { headers: SB_HEADERS });
    if (r.ok) L.activity = await r.json();
  } catch (e) {}
  L.loaded.activity = true; render();
}
function classRoster() {
  const c = ((L.cfg && L.cfg.cohort) || '').toLowerCase();
  return c ? L.roster.filter(p => (p.cohort || '').toLowerCase().split(',').map(s => s.trim()).indexOf(c) !== -1 || (p.cohort || '').toLowerCase() === c) : L.roster;
}
function cohortList() {
  const seen = {}; const out = [];
  function add(c) { const k = c.toLowerCase(); if (!seen[k]) { seen[k] = 1; out.push(c); } }
  (L.cohortNames || []).forEach(add);
  L.roster.forEach(p => (p.cohort || '').split(',').map(s => s.trim()).filter(Boolean).forEach(add));
  return out.sort((a, b) => a.localeCompare(b));
}

function exoCoreSVG(exo, size) {
  const line = EXO_LINES[exo.line]; if (!line) return '';
  const cw = line.colorways[exo.colorway] || line.colorways.default;
  const gid = 'lx-' + exo.line + '-' + (exo.colorway || 'd');
  let motif = '';
  if (exo.line === 'ironwright') motif = '<polygon points="50,36 62,43 62,57 50,64 38,57 38,43" fill="none" stroke="' + cw.glow + '" stroke-width="2.5" opacity="0.9"/><circle cx="50" cy="50" r="5" fill="' + cw.glow + '"/>';
  else if (exo.line === 'resonant') motif = '<g fill="none" stroke="' + cw.glow + '" stroke-linecap="round"><path d="M38,50 a12,12 0 0 1 24,0" stroke-width="2.5" opacity="0.9"/><path d="M32,52 a18,18 0 0 1 36,0" stroke-width="2" opacity="0.55"/></g><circle cx="50" cy="56" r="4.5" fill="' + cw.glow + '"/>';
  else if (exo.line === 'mythweaver') motif = '<path d="M50,30 c14,4 16,20 4,26 c10,2 14,12 6,18 c-2,-8 -12,-10 -16,-4 c-6,-10 0,-18 8,-20 c-10,-4 -10,-16 -2,-20z" fill="' + cw.glow + '" opacity="0.85"/>';
  else motif = '<g fill="' + cw.glow + '"><rect x="34" y="40" width="24" height="5" opacity="0.9"/><rect x="42" y="49" width="24" height="5" opacity="0.65"/><rect x="36" y="58" width="18" height="5" opacity="0.8"/></g>';
  return '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '"><defs><radialGradient id="' + gid + '" cx="50%" cy="42%" r="60%"><stop offset="0%" stop-color="' + cw.a + '"/><stop offset="100%" stop-color="' + cw.b + '"/></radialGradient></defs><circle cx="50" cy="50" r="30" fill="url(#' + gid + ')" stroke="' + cw.glow + '" stroke-width="1.5"/><circle cx="50" cy="50" r="36" fill="none" stroke="' + cw.a + '" stroke-width="1" opacity="0.35"/>' + motif + '</svg>';
}
function exoAvatarHTML(pid, size, fallbackName, image) {
  const ex = L.exo[pid];
  const hasExo = !!(ex && EXO_LINES[ex.line]);
  const mode = (L.cfg && L.cfg.avatarMode) || 'photo';
  if (mode === 'exo' && hasExo) return exoCoreSVG(ex, size);
  if (image) return '<img src="' + esc(image) + '" style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;object-fit:cover;display:block">';
  if (hasExo) return exoCoreSVG(ex, size);
  const initials = (fallbackName || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  return '<div class="ph" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size / 3.4) + 'px">' + esc(initials) + '</div>';
}

// ── economy actions: proposals via PflxDataBus + lite_activity audit ──
function postAward(playerId, awardObj) {
  try { if (inPlatform) window.parent.postMessage(JSON.stringify({ type: 'pflx_award_proposed', playerId: playerId, source: 'lite', award: awardObj }), '*'); } catch (e) {}
}
async function liteLog(playerId, kind, label, xc) {
  try {
    await fetch(SUPABASE_URL + '/rest/v1/lite_activity', { method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, SB_HEADERS),
      body: JSON.stringify({ cohort: (L.cfg && L.cfg.cohort) || '', player_id: playerId, host_id: (L.me && L.me.id) || '', kind: kind, label: label, xc: xc }) });
  } catch (e) {}
  L.activity.unshift({ cohort: (L.cfg && L.cfg.cohort) || '', player_id: playerId, host_id: (L.me && L.me.id) || '', kind: kind, label: label, xc: xc, ts: new Date().toISOString() });
}
function applyAction(players, preset, kind) {
  players.forEach(p => {
    postAward(p.id, { xc: preset.xc, reason: 'lite.' + kind + '.' + preset.label.toLowerCase().replace(/\s+/g, '-'), noMultiplier: kind !== 'award' || undefined });
    p.xc = Math.max(0, (p.xc || 0) + preset.xc);
    if (preset.xc > 0) p.totalXc = (p.totalXc || 0) + preset.xc;
    liteLog(p.id, kind, preset.label, preset.xc);
    burst(p.id, (preset.xc > 0 ? '+' : '') + preset.xc);
  });
  clearSel(); render();
  toast(preset.icon + ' ' + preset.label + ' → ' + players.length + ' player' + (players.length === 1 ? '' : 's') + (L.demo ? ' (demo — not saved to real balances)' : ''));
}
function grantBadge(players, name) {
  const id = 'b-lite-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  players.forEach(p => {
    postAward(p.id, { badge: { id: id, name: name, category: 'primary' }, reason: 'lite.badge' });
    p.badges = (p.badges || 0) + 1;
    liteLog(p.id, 'badge', name, 0);
    burst(p.id, '🎖️');
  });
  clearSel(); render(); toast('🎖️ ' + name + ' granted to ' + players.length);
}

// ── selection + micro UI ──
function toggleSel(pid) { if (!L.isHost) return; L.selected[pid] ? delete L.selected[pid] : L.selected[pid] = 1; render(); }
function clearSel() { L.selected = {}; }
function selPlayers() { return classRoster().filter(p => L.selected[p.id]); }
function selectAll() { classRoster().forEach(p => L.selected[p.id] = 1); render(); }
function burst(pid, txt) {
  setTimeout(() => {
    const el = document.getElementById('burst-' + pid); if (!el) return;
    el.textContent = txt; el.style.color = String(txt).indexOf('-') === 0 ? '#ff8ba0' : '#7dffb8';
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }, 30);
}
let _toastT = null;
function toast(t) {
  const b = document.getElementById('toastBox');
  b.innerHTML = '<div class="toast">' + t + '</div>';
  clearTimeout(_toastT); _toastT = setTimeout(() => { b.innerHTML = ''; }, 2600);
}
function modal(html) { document.getElementById('modalBox').innerHTML = html; document.getElementById('modal').classList.add('on'); }
function modalClose() { document.getElementById('modal').classList.remove('on'); }
document.addEventListener('click', e => { if (e.target && e.target.id === 'modal') modalClose(); });

// ── leaderboard math ──
function weekStart(offsetWeeks) {
  const d = new Date(); const day = (d.getDay() + 6) % 7; // Monday start
  d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - day - (offsetWeeks || 0) * 7);
  return d;
}
function sumActivity(pid, from, to) {
  let s = 0;
  L.activity.forEach(a => {
    if (a.player_id !== pid) return;
    const t = new Date(a.ts);
    if (t >= from && (!to || t < to) && a.xc > 0) s += a.xc;
  });
  return s;
}
function boardData(tab) {
  const R = classRoster();
  if (tab === 'season') return R.map(p => ({ p: p, v: p.totalXc || 0 })).sort((a, b) => b.v - a.v);
  if (tab === 'weekly') { const w = weekStart(0); return R.map(p => ({ p: p, v: sumActivity(p.id, w) })).sort((a, b) => b.v - a.v); }
  if (tab === 'improved') {
    const w0 = weekStart(0), w1 = weekStart(1);
    return R.map(p => ({ p: p, v: sumActivity(p.id, w0) - sumActivity(p.id, w1, w0) })).sort((a, b) => b.v - a.v);
  }
  if (tab === 'teams') {
    const t = {}; (L.cfg.teams.names || []).forEach(n => t[n] = 0);
    const w = weekStart(0);
    R.forEach(p => { const tn = L.cfg.teams.assign[p.id]; if (tn) { t[tn] = (t[tn] || 0) + sumActivity(p.id, w); } });
    return Object.keys(t).map(n => ({ team: n, v: t[n] })).sort((a, b) => b.v - a.v);
  }
  return [];
}
const TEAM_COLORS = ['#39c0ff', '#ff8ba0', '#7dffb8', '#ffd166', '#cbb8ff', '#ffb37d'];
function teamColor(name) { const i = (L.cfg.teams.names || []).indexOf(name); return TEAM_COLORS[(i + TEAM_COLORS.length) % TEAM_COLORS.length]; }

<script>
// ═══════════ RENDER ═══════════
function sessionAppliesToMe() {
  const s = L.liveSession; if (!s) return false;
  if (L.isHost || s.allCohorts || !s.cohorts || !s.cohorts.length) return true;

  return s.cohorts.indexOf(myCohort) !== -1;
}
function liveSessionBanner() {

  const s = L.liveSession;
  const hasAgenda = s.agenda && s.agenda.length;
  return '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(239,68,68,0.09);border:1px solid rgba(239,68,68,0.35);border-radius:12px;padding:10px 14px;margin-bottom:12px;">' +
    '<span style="font-family:Audiowide;font-size:10px;font-weight:800;letter-spacing:0.14em;color:#ff5d7a;">\u{1F534} LIVE</span>' +
    '<span style="font-size:13px;font-weight:700;color:#f0f0ff;">' + esc(s.title || 'Session') + '</span>' +
    (s.code ? '<span style="font-size:11px;color:#8a93b8;">code <b style="color:#ffd166;letter-spacing:0.08em;">' + esc(s.code) + '</b></span>' : '') +

}

// ── LIVE AGENDA / GUIDE (PATCH LITE v0.3) ──
// Read-only for everyone in this patch: the host authors and advances the
// agenda from the Console (mcAgendaNext/mcAgendaPrev), which re-broadcasts
// pflx_session_live_broadcast; this screen just displays wherever the class
// currently is, plus a local countdown timer that restarts whenever the
// current step changes. Advancing FROM inside PFLX Live is deferred --
// there's no reverse (iframe -> Console) write channel yet.
const AGENDA_TYPE_META = {
  mindful:   { icon: '\u{1F9D8}', label: 'Mindful Moment' },
  activity:  { icon: '\u{1F4CB}', label: 'Activity' },
  project:   { icon: '\u{1F6E0}\uFE0F', label: 'Project Work' },
  game:      { icon: '\u{1F3AE}', label: 'Game / Media' },
  social:    { icon: '\u{1F91D}', label: 'Social Sprint' },
  thinkpair: { icon: '\u{1F4AC}', label: 'Think \u00B7 Pair \u00B7 Share' },
  exit:      { icon: '\u{1F3AB}', label: 'Exit Ticket' },
  custom:    { icon: '\u270F\uFE0F', label: 'Custom' }
};
let agendaTimerIv = null, agendaTimerFor = null;

function joinLiveAgenda() {
  if (!L.liveSession || !L.liveSession.agenda || !L.liveSession.agenda.length) return;
  L.agendaScreenFrom = L.screen;
  L.screen = 'liveagenda';
  startAgendaTimer();
  render();
}
function leaveLiveAgenda() {
  stopAgendaTimer();
  L.screen = L.agendaScreenFrom || (L.isHost ? 'class' : 'me');
  render();
}
function startAgendaTimer() {
  stopAgendaTimer();
  const s = L.liveSession; if (!s || !s.agenda) return;
  const item = s.agenda[s.currentAgendaIndex || 0];
  agendaTimerFor = s.currentAgendaIndex || 0;
  if (!item || !item.timer || !item.timer.enabled) return;
  let remaining = (item.timer.presetMinutes || 5) * 60;
  const total = remaining;
  const draw = () => {
    const bar = document.getElementById('agendaTimerBar');
    const val = document.getElementById('agendaTimerVal');
    if (!bar || !val) return;
    const pct = Math.max(0, Math.round((remaining / total) * 100));
    bar.style.width = pct + '%';
    bar.style.background = remaining <= 10 ? '#ff5d7a' : (pct < 30 ? '#ffd166' : '#7dffb8');
    const m = Math.floor(Math.max(0, remaining) / 60), sec = Math.max(0, remaining) % 60;
    val.textContent = m + ':' + String(sec).padStart(2, '0');
  };
  draw();
  agendaTimerIv = setInterval(() => {
    remaining--;
    if (remaining < 0) { clearInterval(agendaTimerIv); agendaTimerIv = null; draw(); return; }
    draw();
  }, 1000);
}
function stopAgendaTimer() {
  if (agendaTimerIv) { clearInterval(agendaTimerIv); agendaTimerIv = null; }
  agendaTimerFor = null;
}
function rLiveAgenda() {
  const s = L.liveSession;
  if (!s || !s.agenda || !s.agenda.length) { leaveLiveAgenda(); return ''; }
  const idx = s.currentAgendaIndex || 0;
  const item = s.agenda[idx];
  const meta = AGENDA_TYPE_META[item.type] || AGENDA_TYPE_META.custom;
  const rail = s.agenda.map((a, i) => {
    const m = AGENDA_TYPE_META[a.type] || AGENDA_TYPE_META.custom;
    const active = i === idx;
    return '<div style="display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;margin-bottom:4px;' +
      (active ? 'background:rgba(255,209,102,0.12);border:1px solid rgba(255,209,102,0.4);' : 'border:1px solid transparent;opacity:0.55;') + '">' +
      '<span style="font-size:15px;">' + m.icon + '</span>' +
      '<span style="font-family:Audiowide;font-size:8.5px;font-weight:800;color:' + (active ? '#ffd166' : '#cbd3f0') + ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(a.title) + '</span>' +
      '</div>';
  }).join('');
  const checklist = (item.checklist && item.checklist.length)
    ? '<div style="margin-top:16px;">' + item.checklist.map(step =>
        '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:#dfe4ff;"><span style="color:#7dffb8;">\u2713</span>' + esc(step) + '</div>').join('') + '</div>'
    : '';
  const timerBlock = (item.timer && item.timer.enabled)
    ? '<div style="margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:6px;">' +
        '<div style="width:min(320px,80vw);height:16px;background:rgba(255,255,255,0.08);border-radius:8px;overflow:hidden;"><div id="agendaTimerBar" style="height:100%;width:100%;background:#7dffb8;transition:width 1s linear,background 0.3s;"></div></div>' +
        '<div id="agendaTimerVal" style="font-family:Audiowide;font-size:26px;font-weight:900;color:#f0f0ff;"></div>' +
      '</div>'
    : '';
  return '<div style="padding:16px;min-height:100vh;box-sizing:border-box;">' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">' +
    '<span style="font-family:Audiowide;font-size:10px;font-weight:800;letter-spacing:0.14em;color:#ff5d7a;">\u{1F534} LIVE</span>' +
    '<span style="font-family:Audiowide;font-size:12px;font-weight:800;color:#7de9ff;">' + esc(s.title || 'Session') + '</span>' +
    '<span style="flex:1"></span>' +
    '<button class="bigbtn ghost" style="padding:7px 14px;font-size:9.5px;" onclick="leaveLiveAgenda()">\u2715 LEAVE</button>' +
    '</div>' +
    '<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">' +
    '<div style="width:150px;flex:0 0 auto;">' + rail + '</div>' +
    '<div class="card" style="flex:1;min-width:240px;text-align:center;padding:28px 20px;">' +
    '<div style="font-size:34px;margin-bottom:6px;">' + meta.icon + '</div>' +
    '<div style="font-family:Audiowide;font-size:9px;letter-spacing:0.16em;color:#a78bfa;margin-bottom:4px;">' + meta.label.toUpperCase() + ' \u00B7 STEP ' + (idx + 1) + ' / ' + s.agenda.length + '</div>' +
    '<h2 style="font-family:Audiowide;font-size:19px;margin:0 0 10px;color:#f0f0ff;">' + esc(item.title) + '</h2>' +
    (item.prompt ? '<div style="font-size:14px;color:#c7cdec;line-height:1.5;max-width:440px;margin:0 auto;">' + esc(item.prompt) + '</div>' : '') +
    checklist + timerBlock +
    '</div></div></div>';
}

function render() {
  const app = document.getElementById('app');
  if (!L.cfg) { app.innerHTML = '<div style="padding:60px;text-align:center"><img src="' + PFLX_LIVE_LOGO_STACKED + '" alt="PFLX Live" style="width:220px;max-width:70vw;display:inline-block"/><div style="margin-top:14px;font-family:Audiowide;color:#7de9ff;letter-spacing:0.2em;font-size:13px">LOADING…</div></div>'; return; }

    : [['me', '🤖 MY EXO'], ['boards', '🏆 BOARDS'], ['shop', '🎁 UPGRADES'], ['play', '🎮 PLAY']];
  const cur = tabs.some(t => t[0] === L.screen) ? L.screen : tabs[0][0];
  app.innerHTML =
    '<div class="hd"><div class="logo"><img src="' + PFLX_LIVE_LOGO_HORIZONTAL + '" alt="PFLX Live" class="logo-img"/><span class="logo-pulse" title="Live"></span></div><div class="sub">' +
    (L.isHost ? 'Host Dashboard · ' + esc(L.cfg.cohort || 'All Players') : esc((L.me && L.me.brand) || 'Player')) + '</div><div class="sp"></div>' +
    (L.isHost ? '<button class="bigbtn ghost" onclick="projOpen()">📽️ PROJECTOR</button>' : '') + '</div>' +
    (L.demo ? '<div class="demoBanner">DEMO MODE — open PFLX Live inside the PFLX Platform for real balances. Everything is tappable; nothing you do here changes real XC.</div>' : '') +
    liveSessionBanner() +
    '<div class="tabbar">' + tabs.map(t => '<div class="tab ' + (cur === t[0] ? 'on' : '') + '" onclick="go(\'' + t[0] + '\')">' + t[1] + '</div>').join('') + '</div>' +
    ({ class: rClass, teams: rTeams, boards: rBoards, tools: rTools, play: rPlay, feed: rFeed, setup: rSetup, me: rMe, shop: rShop })[cur]();
  renderTray();
}
function go(s) { if (L.screen === 'tools' && s !== 'tools' && typeof noiseState !== 'undefined' && noiseState.active) stopNoiseMeter(); L.screen = s; clearSel(); render(); }

// ── CLASS (roster grid) ──
function rClass() {
  const R = classRoster();
  const goal = L.cfg.goal || DEFAULT_CFG.goal;
  const w = weekStart(0);
  const earned = R.reduce((s, p) => s + sumActivity(p.id, w), 0);
  const pct = Math.min(100, Math.round(earned / Math.max(1, goal.target) * 100));
  return '<div class="card" style="margin-bottom:14px"><div class="cardT">Class Goal — ' + esc(goal.label) + '</div>' +
    '<div class="goalwrap"><div class="goalfill" style="width:' + pct + '%"></div><div class="goaltxt">' + earned.toLocaleString() + ' / ' + goal.target.toLocaleString() + ' XC THIS WEEK · ' + pct + '%</div></div></div>' +
    '<div class="card"><div class="cardT" style="display:flex;gap:10px;align-items:center">Players (' + R.length + ')' +
    '<span style="margin-left:auto"></span>' +
    '<button class="bigbtn ghost" style="padding:7px 12px;font-size:9px" onclick="selectAll()">SELECT ALL</button>' +
    '<button class="bigbtn ghost" style="padding:7px 12px;font-size:9px" onclick="clearSel();render()">CLEAR</button></div>' +
    '<div id="roster">' + R.map(p => {

        '<div class="burst" id="burst-' + p.id + '"></div>' +

    }).join('') + '</div></div>';
}
function renderTray() {
  const tray = document.getElementById('tray');
  const sel = selPlayers();
  if (!L.isHost || !sel.length) { tray.classList.remove('on'); return; }

// ── Noise Meter (ported from the Console's mcToggleNoiseMeter — same
//    getUserMedia+AnalyserNode approach, adapted to PFLX Live's own UI) ──
const noiseState = { active: false, ctx: null, stream: null, raf: null };
function toggleNoiseMeter() {
  if (noiseState.active) { stopNoiseMeter(); return; }
  startNoiseMeter();
}
function startNoiseMeter() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('🎙️ Microphone access is not supported in this browser.');
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    noiseState.stream = stream;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    noiseState.ctx = ctx;
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    noiseState.active = true;
    showNoiseMeterUI();
    let smooth = 0;
    function tick() {
      if (!noiseState.active) return;
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const level = sum / data.length;
      smooth = smooth * 0.8 + level * 0.2;
      updateNoiseMeterUI(Math.max(0, Math.min(100, Math.round((smooth / 130) * 100))));
      noiseState.raf = requestAnimationFrame(tick);
    }
    tick();
    const btn = document.getElementById('noiseMeterBtn');
    if (btn) btn.textContent = 'STOP LISTENING';
  }).catch(err => {
    toast('🎙️ Could not access the microphone: ' + (err && err.message ? err.message : err));
  });
}
function stopNoiseMeter() {
  noiseState.active = false;
  if (noiseState.raf) cancelAnimationFrame(noiseState.raf);
  if (noiseState.stream) { try { noiseState.stream.getTracks().forEach(t => t.stop()); } catch (e) {} }
  if (noiseState.ctx) { try { noiseState.ctx.close(); } catch (e) {} }
  noiseState.stream = null;
  noiseState.ctx = null;
  const el = document.getElementById('noiseMeterOverlay');
  if (el) el.remove();
  const btn = document.getElementById('noiseMeterBtn');
  if (btn) btn.textContent = 'START LISTENING';
}
function showNoiseMeterUI() {
  const existing = document.getElementById('noiseMeterOverlay');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'noiseMeterOverlay';
  el.style.cssText = 'position:fixed;bottom:70px;right:16px;background:rgba(10,18,40,0.95);border:1px solid rgba(57,192,255,0.3);border-radius:14px;padding:14px 18px;z-index:9999;font-family:"Exo 2",sans-serif;width:190px;box-shadow:0 10px 40px rgba(0,0,0,0.4);';
  el.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
    '<span style="font-family:Audiowide;font-size:10px;font-weight:900;color:#39c0ff;letter-spacing:0.08em;">🔊 NOISE METER</span>' +
    '<button onclick="stopNoiseMeter()" style="background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:14px;">✕</button>' +
    '</div>' +
    '<div style="height:14px;background:rgba(255,255,255,0.06);border-radius:7px;overflow:hidden;"><div id="noiseMeterBar" style="height:100%;width:0%;background:#7dffb8;transition:width 0.15s,background 0.3s;"></div></div>' +
    '<div id="noiseMeterLabel" style="text-align:center;font-size:11px;margin-top:6px;color:rgba(255,255,255,0.5);">Listening…</div>';
  document.body.appendChild(el);
}
function updateNoiseMeterUI(level) {
  const bar = document.getElementById('noiseMeterBar');
  const label = document.getElementById('noiseMeterLabel');
  if (!bar) return;
  bar.style.width = level + '%';
  const color = level < 35 ? '#7dffb8' : (level < 65 ? '#ffd166' : '#ff5d7a');
  bar.style.background = color;
  if (label) label.textContent = level < 35 ? 'Quiet 🙂' : (level < 65 ? 'Getting loud…' : 'TOO LOUD! 🚨');
}

  const n = wheelPlayers.length; if (!n) return;

    }
    proj.innerHTML = inner + '<div style="position:fixed;bottom:18px;right:20px;display:flex;gap:8px"><button class="bigbtn ghost" onclick="projIdx++;projDrawNow()">NEXT ▸</button><button class="bigbtn ghost" onclick="projClose()">CLOSE</button></div>' +
      '<div style="position:fixed;bottom:20px;left:22px;display:flex;align-items:center"><img src="' + PFLX_LIVE_LOGO_HORIZONTAL + '" alt="PFLX Live" style="height:20px;width:auto;opacity:0.9"/></div>';
  }
  window.projDrawNow = draw;
  draw();
  clearInterval(projIv); projIv = setInterval(() => { projIdx++; draw(); }, 12000);
}
function projClose() {
  clearInterval(projIv); clearInterval(L.timers.main);
  document.getElementById('proj').classList.remove('on');
  document.getElementById('proj').innerHTML = '';
}

// ── PLAY ──
function rPlay() {
  return '<div class="grid3">' +
    '<div class="card"><div class="cardT">💰 Vault Rush</div><div style="font-size:12px;color:#8a93b8;margin-bottom:10px">Blooket-style class game: answer questions, crack vaults, steal gold. Everyone joins with the room code on the projector.</div>' +
    (L.isHost ? '<button class="bigbtn gold" onclick="location.href=\'games/vault-rush.html?host=1' + (L.demo ? '' : '&sso=pflx&id=' + encodeURIComponent(L.me.id) + '&brand=' + encodeURIComponent(L.me.brand) + '&host=1') + '\'">HOST A GAME</button>'
      : '<button class="bigbtn gold" onclick="joinRoomModal()">JOIN WITH CODE</button>') + '</div>' +
    '<div class="card"><div class="cardT">🤖 Battle Arena</div><div style="font-size:12px;color:#8a93b8;margin-bottom:10px">The full arena — EXO Clash and 18 more game modes — lives in the PFLX Platform.</div>' +
    '<button class="bigbtn" onclick="toast(\'Open Battle Arena from the PFLX Platform menu\')">OPEN IN PLATFORM</button></div>' +
    (L.isHost ? '<div class="card"><div class="cardT">📚 Question Sets</div><div style="font-size:12px;color:#8a93b8;margin-bottom:10px">Create sets or import CSV (question,answer per line). Sets power Vault Rush.</div><button class="bigbtn" onclick="qsetsModal()">MANAGE SETS</button></div>' : '') +
    '</div>';
}
function joinRoomModal() {
  modal('<div class="cardT">Join Vault Rush</div><label>Room code</label><input id="roomCode" maxlength="4" style="text-transform:uppercase;font-family:Audiowide;font-size:22px;text-align:center;letter-spacing:0.4em" placeholder="ABCD"/>' +
    '<div style="margin-top:14px;display:flex;gap:8px"><button class="bigbtn gold" onclick="var c=document.getElementById(\'roomCode\').value.trim().toUpperCase(); if(c.length===4) location.href=\'games/vault-rush.html?room=\'+c+\'&pid=\'+encodeURIComponent((L.me&&L.me.id)||(\'guest-\'+Math.random().toString(36).slice(2,7)))+\'&pname=\'+encodeURIComponent((L.me&&L.me.brand)||\'Player\');">JOIN</button>' +
    '<button class="bigbtn ghost" onclick="modalClose()">CANCEL</button></div>');
}
// question sets manager
async function qsetsModal() {
  const sets = (await kvLoad('pflx_lite_qsets')) || { sets: [] };
  window._qsets = sets;
  modal('<div class="cardT">Question Sets (' + sets.sets.length + ')</div>' +
    sets.sets.map((s, i) => '<div class="feedrow"><b>' + esc(s.name) + '</b> · ' + s.cards.length + ' questions <span class="t"><button class="bigbtn red" style="padding:5px 10px;font-size:8px" onclick="delQset(' + i + ')">DELETE</button></span></div>').join('') +
    '<label>New set name</label><input id="qsName" placeholder="e.g. Fractions Week 3"/>' +
    '<label>Questions — one per line: question, answer</label><textarea id="qsCsv" rows="7" placeholder="2+2, 4&#10;Capital of Japan, Tokyo&#10;H2O is, water"></textarea>' +
    '<div style="margin-top:12px;display:flex;gap:8px"><button class="bigbtn gold" onclick="addQset()">SAVE SET</button><button class="bigbtn ghost" onclick="modalClose()">DONE</button></div>');
}
function addQset() {
  const name = document.getElementById('qsName').value.trim();
  const lines = document.getElementById('qsCsv').value.split('\n').map(l => l.trim()).filter(Boolean);
  const cards = lines.map(l => { const c = l.indexOf(','); return c > 0 ? { term: l.slice(0, c).trim(), definition: l.slice(c + 1).trim() } : null; }).filter(x => x && x.term && x.definition);
  if (!name || cards.length < 4) { toast('Need a name and at least 4 "question, answer" lines'); return; }
  window._qsets.sets.push({ id: 'qs-' + Date.now(), name: name, cards: cards, createdBy: (L.me && L.me.id) || '', createdAt: Date.now() });
  kvSave('pflx_lite_qsets', window._qsets); toast('📚 Saved ' + name); qsetsModal();
}
function delQset(i) { window._qsets.sets.splice(i, 1); kvSave('pflx_lite_qsets', window._qsets); qsetsModal(); }

// ── FEED ──
function rFeed() {
  const rows = L.activity.slice(0, 60).map(a => {
    const p = L.roster.find(r => r.id === a.player_id);
    const icon = { award: '✅', fine: '⚠️', tax: '🏛️', upgrade: '🎁', badge: '🎖️' }[a.kind] || '•';
    return '<div class="feedrow">' + icon + ' <b>' + esc(p ? p.brand : a.player_id) + '</b> ' + esc(a.label) +
      (a.xc ? ' <span style="color:' + (a.xc > 0 ? '#7dffb8' : '#ff8ba0') + ';font-weight:700">' + (a.xc > 0 ? '+' : '') + a.xc + ' XC</span>' : '') +
      '<span class="t">' + new Date(a.ts).toLocaleString() + '</span></div>';
  }).join('');
  return '<div class="card"><div class="cardT">Activity Feed (last 15 days)</div>' + (rows || '<div style="color:#8a93b8;font-size:12px">Nothing yet — award something!</div>') + '</div>';
}

// ── SETUP ──
function rSetup() {
  const cs = cohortList();
  return '<div class="grid2">' +
    '<div class="card"><div class="cardT">My Class</div><label>Cohort (which players are this class)</label>' +
    '<select onchange="L.cfg.cohort=this.value;saveCfg();render()"><option value="">All players</option>' + cs.map(c => '<option ' + (L.cfg.cohort === c ? 'selected' : '') + '>' + esc(c) + '</option>').join('') + '</select>' +
    '<label>Class goal label</label><input value="' + esc(L.cfg.goal.label) + '" onchange="L.cfg.goal.label=this.value;saveCfg()"/>' +
    '<label>Class goal target (XC / week)</label><input type="number" value="' + L.cfg.goal.target + '" onchange="L.cfg.goal.target=Math.max(100,parseInt(this.value)||10000);saveCfg()"/>' +
    '<label>Leaderboards</label>' +
    '<div style="display:flex;gap:14px;font-size:13px;color:#ccc;margin-top:4px"><label style="display:flex;gap:6px;align-items:center;text-transform:none;font-family:inherit;font-size:13px"><input type="checkbox" style="width:auto" ' + (L.cfg.boards.showRanks ? 'checked' : '') + ' onchange="L.cfg.boards.showRanks=this.checked;saveCfg()"/> Players can see boards</label>' +
    '<label style="display:flex;gap:6px;align-items:center;text-transform:none;font-family:inherit;font-size:13px"><input type="checkbox" style="width:auto" ' + (L.cfg.boards.top5Only ? 'checked' : '') + ' onchange="L.cfg.boards.top5Only=this.checked;saveCfg()"/> Top 5 only</label></div>' +
    '<label style="margin-top:10px">Avatar style</label>' +
    '<select onchange="L.cfg.avatarMode=this.value;saveCfg();render()"><option value="photo"' + ((L.cfg.avatarMode || 'photo') === 'photo' ? ' selected' : '') + '>Real photos (EXO/initials if none)</option><option value="exo"' + (L.cfg.avatarMode === 'exo' ? ' selected' : '') + '>EXO mascots (photo/initials if none built)</option></select>' +
    '</div>' +
    '<div class="card"><div class="cardT">Quick Buttons</div>' + presetEditor('awards') + presetEditor('fines') +
    '<div class="cardT" style="margin-top:14px">Upgrades Shop</div>' +
    L.cfg.upgrades.map((u, i) => '<div class="feedrow">' + u.icon + ' <b>' + esc(u.label) + '</b> · ' + u.cost + ' XC <span class="t"><button class="bigbtn red" style="padding:4px 9px;font-size:8px" onclick="L.cfg.upgrades.splice(' + i + ',1);saveCfg();render()">✕</button></span></div>').join('') +
    '<div style="display:flex;gap:6px;margin-top:8px"><input id="upLbl" placeholder="Privilege" style="flex:2"/><input id="upCost" type="number" placeholder="XC" style="flex:1"/><button class="bigbtn green" style="padding:8px 12px" onclick="var l=document.getElementById(\'upLbl\').value.trim(),c=parseInt(document.getElementById(\'upCost\').value)||0; if(l&&c>0){L.cfg.upgrades.push({id:\'up-\'+Date.now(),label:l,icon:\'🎁\',cost:c});saveCfg();render();}">ADD</button></div></div></div>';
}
function presetEditor(kind) {
  const arr = L.cfg[kind];
  return '<div style="font-size:11px;color:#8a93b8;margin:8px 0 4px;text-transform:uppercase;font-family:Audiowide;font-weight:700">' + (kind === 'awards' ? 'Awards' : 'Fines') + '</div>' +
    arr.map((a, i) => '<div class="feedrow">' + a.icon + ' <b>' + esc(a.label) + '</b> · ' + a.xc + ' XC <span class="t"><button class="bigbtn red" style="padding:4px 9px;font-size:8px" onclick="L.cfg.' + kind + '.splice(' + i + ',1);saveCfg();render()">✕</button></span></div>').join('') +
    '<div style="display:flex;gap:6px;margin-top:6px"><input id="pe-' + kind + '-l" placeholder="Label" style="flex:2"/><input id="pe-' + kind + '-x" type="number" placeholder="XC" style="flex:1"/>' +
    '<button class="bigbtn green" style="padding:8px 12px" onclick="var l=document.getElementById(\'pe-' + kind + '-l\').value.trim(),x=parseInt(document.getElementById(\'pe-' + kind + '-x\').value)||0; if(l&&x' + (kind === 'fines' ? '<0' : '>0') + '){L.cfg.' + kind + '.push({label:l,icon:\'' + (kind === 'fines' ? '⚠️' : '⭐') + '\',xc:x});saveCfg();render();}">ADD</button></div>';
}

// ── PLAYER VIEW ──
function myRecord() { return L.roster.find(p => p.id === (L.me && L.me.id)) || { id: (L.me && L.me.id) || 'me', brand: (L.me && L.me.brand) || 'Player', xc: 0, totalXc: 0, badges: 0 }; }
function rMe() {
  const p = myRecord();
  const ex = L.exo[p.id];
  const w = weekStart(0);
  const week = sumActivity(p.id, w);
  const board = boardData('weekly');
  const rank = board.findIndex(r => r.p.id === p.id) + 1;
  const team = L.cfg.teams.assign[p.id];
  return '<div class="grid2">' +
    '<div class="card" style="text-align:center"><div style="display:flex;justify-content:center;filter:drop-shadow(0 0 22px rgba(120,140,255,0.5))">' + exoAvatarHTML(p.id, 150, p.brand, p.image) + '</div>' +
    '<div style="font-family:Audiowide;font-weight:900;font-size:17px;color:#fff;margin-top:10px">' + esc(ex && ex.exo_name ? ex.exo_name : p.brand) + '</div>' +
    (ex ? '<div style="font-size:10px;color:#8a93b8;font-family:Audiowide;letter-spacing:0.1em">' + EXO_LINES[ex.line].name + ' · STAGE ' + (ex.stage || 1) + '</div>' : '<div style="font-size:11px;color:#8a93b8">Visit the EXO Bay in Battle Arena to hatch your EXO!</div>') +
    '<div style="font-family:Audiowide;font-weight:900;font-size:26px;color:#ffd166;margin-top:12px">' + (p.xc || 0).toLocaleString() + ' XC</div>' +
    '<div style="font-size:11px;color:#8a93b8">+' + week.toLocaleString() + ' this week' + (L.cfg.boards.showRanks && rank ? ' · #' + rank + ' in class' : '') + (team ? ' · TEAM ' + esc(team) : '') + '</div></div>' +
    '<div class="card"><div class="cardT">🎖️ My Badges</div><div style="font-size:34px">' + '🎖️'.repeat(Math.min(12, p.badges || 0)) + (p.badges > 12 ? ' +' + (p.badges - 12) : '') + (!p.badges ? '<span style="font-size:12px;color:#8a93b8">None yet — earn your first!</span>' : '') + '</div>' +
    '<div class="cardT" style="margin-top:16px">📜 My Recent</div>' +
    L.activity.filter(a => a.player_id === p.id).slice(0, 6).map(a => '<div class="feedrow">' + ({ award: '✅', fine: '⚠️', tax: '🏛️', upgrade: '🎁', badge: '🎖️' }[a.kind] || '•') + ' ' + esc(a.label) + (a.xc ? ' <b style="color:' + (a.xc > 0 ? '#7dffb8' : '#ff8ba0') + '">' + (a.xc > 0 ? '+' : '') + a.xc + '</b>' : '') + '</div>').join('') +
    '</div></div>';
}
function rShop() {
  const p = myRecord();
  return '<div class="card"><div class="cardT">🎁 Class Upgrades — spend your XC</div>' +
    '<div class="grid3">' + L.cfg.upgrades.map((u, i) =>
      '<div class="upcard"><div class="ic">' + u.icon + '</div><div class="lb">' + esc(u.label) + '</div>' +
      '<button class="bigbtn gold" style="width:100%" onclick="buyUpgrade(' + i + ')">' + u.cost.toLocaleString() + ' XC</button></div>').join('') + '</div>' +
    '<div style="font-size:10px;color:#5c6488;margin-top:12px">Your teacher sees every redemption in the feed and makes it happen in class. Balance: ' + (p.xc || 0).toLocaleString() + ' XC</div></div>';
}
function buyUpgrade(i) {
  const u = L.cfg.upgrades[i]; const p = myRecord();
  if ((p.xc || 0) < u.cost) { toast('Not enough XC — you have ' + (p.xc || 0).toLocaleString()); return; }
  modal('<div class="cardT">Redeem ' + esc(u.label) + '?</div><div style="font-size:13px;color:#aeb6d8">This spends <b style="color:#ffd166">' + u.cost.toLocaleString() + ' XC</b>. Your teacher gets notified in the feed.</div>' +
    '<div style="margin-top:14px;display:flex;gap:8px"><button class="bigbtn gold" onclick="confirmUpgrade(' + i + ')">REDEEM</button><button class="bigbtn ghost" onclick="modalClose()">CANCEL</button></div>');
}
function confirmUpgrade(i) {
  const u = L.cfg.upgrades[i]; const p = myRecord();
  postAward(p.id, { xc: -u.cost, reason: 'lite.upgrade.' + u.id });
  p.xc = Math.max(0, (p.xc || 0) - u.cost);
  liteLog(p.id, 'upgrade', u.label, -u.cost);
  modalClose(); render(); toast('🎁 ' + u.label + ' redeemed! Your teacher has been notified.' + (L.demo ? ' (demo)' : ''));
}

// ── BOOT ──
adoptFromParams();
render();
loadCfg(); loadRoster(); loadExo(); loadActivity(); loadCohortGroups();
setInterval(loadActivity, 60000);
</script>
